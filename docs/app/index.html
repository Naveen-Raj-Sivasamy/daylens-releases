<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'" />
<meta name="referrer" content="no-referrer" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Daylens — Work &amp; Status Reports</title>
<meta name="description" content="Daylens in your browser: your team's work, status reports, tickets and leave." />
<meta name="theme-color" content="#16332a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Daylens" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<style>
  html, body { margin: 0; height: 100%; background: #16332a; overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #dl-windows { position: fixed; inset: 0; }
  .dl-win[hidden] { display: none !important; }
  .dl-win iframe { display: block; width: 100%; height: 100%; border: 0; background: transparent; }
  .dl-full { position: absolute; inset: 0; }
  .dl-popup { position: absolute; z-index: 20; border-radius: 14px; overflow: hidden; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45); }
  .dl-popup.dl-top { z-index: 30; }
  #dl-start { position: fixed; inset: 0; display: grid; place-items: center; color: #f3ede0; font-size: 15px; letter-spacing: 0.2px; }
  #dl-start[hidden] { display: none; }
  #dl-start .dot { width: 10px; height: 10px; border-radius: 50%; background: #e2b04a; margin: 0 auto 14px; animation: dl-pulse 1.1s ease-in-out infinite; }
  @keyframes dl-pulse { 50% { opacity: 0.25; transform: scale(0.7); } }
  @media (prefers-reduced-motion: reduce) { #dl-start .dot { animation: none; } }
  #dl-link { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 40;
    display: flex; gap: 10px; align-items: center; max-width: calc(100vw - 32px); padding: 10px 12px 10px 16px; border-radius: 14px;
    background: #f6f1e4; color: #1d2a26; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4); font-size: 14px; }
  #dl-link[hidden] { display: none; }
  #dl-link a { flex: none; font-weight: 800; color: #1d1a10; background: #e2b04a; padding: 8px 14px; border-radius: 10px; text-decoration: none; }
  #dl-link button { flex: none; border: 0; background: transparent; font-size: 18px; line-height: 1; padding: 6px; cursor: pointer; color: #5d6b66; }
  #dl-link a:focus-visible, #dl-link button:focus-visible { outline: 3px solid #e2b04a; outline-offset: 2px; }
  noscript { position: fixed; inset: 0; display: grid; place-items: center; color: #f3ede0; padding: 24px; text-align: center; }
</style>
</head>
<body>
<div id="dl-windows"></div>
<div id="dl-start" role="status"><div><div class="dot"></div>Opening Daylens…</div></div>
<div id="dl-link" role="dialog" aria-label="Open the link" hidden><span>Your browser held back a new tab.</span><a id="dl-link-a" href="#" target="_blank" rel="noopener">Open it</a><button type="button" id="dl-link-x" aria-label="Close">✕</button></div>
<noscript>Daylens needs JavaScript. Turn it on for this site, or use the Daylens desktop app.</noscript>
<script>
  window.__DAYLENS_VERSION__ = '1.6.0';
  window.__DAYLENS_ENV__ = {};
  // Daylens never runs inside another site's page (someone else's frame could trick a tap).
  if (window.top !== window.self) { document.documentElement.innerHTML = '<body style="font-family:sans-serif;padding:24px">Open Daylens directly: <a href="' + location.href + '" target="_top">' + location.href + '</a></body>'; throw new Error('framed'); }
  (function () {
    var bar = document.getElementById('dl-link'), a = document.getElementById('dl-link-a');
    document.getElementById('dl-link-x').onclick = function () { bar.hidden = true; };
    a.onclick = function () { setTimeout(function () { bar.hidden = true; }, 50); };
    window.__dlShowLink = function (url) { a.href = url; bar.hidden = false; a.focus(); };
    // The "Opening Daylens…" note goes once a screen is up.
    var start = document.getElementById('dl-start');
    new MutationObserver(function () {
      if (document.querySelector('#dl-windows .dl-full:not([hidden])')) start.hidden = true;
    }).observe(document.getElementById('dl-windows'), { subtree: true, attributes: true, childList: true });
  })();
</script>
<script src="daylens-core.js?v=1.6.0"></script>
</body>
</html>
