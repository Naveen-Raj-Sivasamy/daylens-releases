<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'none'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<script src="../preload-web.js"></script>
<script src="../web-ui.js" defer></script>
<link rel="stylesheet" href="../web.css" />

<meta charset="utf-8" />
<script src="theme.js"></script>
<script src="chime.js"></script>
<title>Daylens reminder</title>
<!--
  The corner pop-up for reminders that fall due. On top of every other
  app, and it STAYS until the person acts on each card: Done, Snooze
  (5 minutes, 15 minutes or an hour, just for them), Open (the app / the
  other team it belongs to), or Stop / ✕ (closes the card; the reminder
  stays in Today until it's done). 1.8: while a card is up it pulses red
  (slowly; steady with motion turned off) and the alarm repeats.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  #stack { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .card {
    position: relative; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start;
    background: var(--chrome); color: var(--on-brand); border: 1px solid rgba(255,255,255,0.10);
    border-radius: 14px; padding: 12px 12px 12px 12px; box-shadow: 0 12px 34px rgba(0,0,0,0.35);
    border-left: 4px solid var(--gold);
  }
  html[data-mode="light"] .card { background: #fff; color: #1d2433; border-color: #e3e7f0; border-left-color: var(--gold); box-shadow: 0 12px 34px rgba(30,45,90,0.18); }
  .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 17px; }
  .title { font-size: 13.5px; font-weight: 750; line-height: 1.3; padding-right: 22px; }
  .detail { font-size: 12px; color: var(--on-brand-dim); margin-top: 3px; line-height: 1.35; }
  html[data-mode="light"] .detail { color: #5f6b85; }
  .team { display: inline-block; margin-top: 5px; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--gold-bright); }
  html[data-mode="light"] .team { color: #12804f; }
  .actions { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
  .actions button {
    border: none; border-radius: 8px; padding: 6px 11px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
    background: rgba(255,255,255,0.10); color: inherit;
  }
  html[data-mode="light"] .actions button { background: #eef1f8; }
  .actions button.primary { background: var(--accent-grad); color: var(--on-accent); }
  html[data-mode="light"] .actions button.primary { background: var(--accent-grad); color: var(--on-accent); }
  .actions button:focus-visible, .x:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .x {
    position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 7px; border: none; cursor: pointer;
    background: transparent; color: inherit; opacity: 0.6; font-size: 13px; line-height: 1;
  }
  .x:hover { opacity: 1; background: rgba(255,255,255,0.10); }
  html[data-mode="light"] .x:hover { background: #eef1f8; }
  .card { animation: alarm-pulse 1.2s ease-in-out infinite; border-left-color: #e5484d !important; }
  @keyframes alarm-pulse { 50% { box-shadow: 0 0 0 3px #e5484d, 0 12px 34px rgba(229,72,77,0.55); } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; box-shadow: 0 0 0 3px #e5484d, 0 12px 34px rgba(0,0,0,0.35); } }
  .more { text-align: right; font-size: 12px; font-weight: 700; color: #fff; padding: 0 6px; text-shadow: 0 1px 3px rgba(0,0,0,0.6); cursor: pointer; }
</style>
</head>
<body>
  <div id="stack" role="alert" aria-live="assertive"></div>
<script>
  const MAX_CARDS = 4;
  const stack = document.getElementById('stack');
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function render(data) {
    const items = (data && data.items) || [];
    stack.innerHTML = '';
    items.slice(-MAX_CARDS).reverse().forEach((it) => { // newest on top
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.key = it.key;
      card.innerHTML = `
        <div class="ic" aria-hidden="true">⏰</div>
        <div>
          <div class="title">${esc(it.title)}</div>
          ${it.detail ? `<div class="detail">${esc(it.detail)}</div>` : ''}
          ${it.teamName ? `<span class="team">${esc(it.teamName)}</span>` : ''}
          <div class="actions">
            ${it.canAct
              ? '<button type="button" class="primary" data-a="done">Done</button><button type="button" data-a="snooze" data-m="5">Snooze 5 min</button><button type="button" data-a="snooze" data-m="15">15 min</button><button type="button" data-a="snooze" data-m="60">1 hour</button><button type="button" data-a="close">Stop</button><button type="button" data-a="open">Open</button>'
              : `<button type="button" class="primary" data-a="open">Open ${esc(it.teamName || 'Daylens')}</button><button type="button" data-a="close">Stop</button>`}
          </div>
        </div>
        <button type="button" class="x" data-a="close" title="Stop the alarm (the reminder stays in Today)" aria-label="Stop">✕</button>`;
      card.querySelectorAll('[data-a]').forEach((b) => {
        b.onclick = () => { b.disabled = true; window.statusApp.alertAction(it.key, b.dataset.a, Number(b.dataset.m) || 0); };
      });
      stack.appendChild(card);
    });
    if (items.length > MAX_CARDS) {
      const more = document.createElement('div');
      more.className = 'more';
      more.textContent = `+${items.length - MAX_CARDS} more — open Reminders`;
      more.onclick = () => window.statusApp.alertAction(items[0].key, 'open');
      stack.appendChild(more);
    }
    requestAnimationFrame(() => window.statusApp.resizeAlert(document.body.scrollHeight));
    // The alarm: right away for a new reminder, then every 4 seconds while any card is up.
    alarmOn = !!(data && data.alarm) && items.length > 0;
    clearInterval(alarmTimer);
    if (alarmOn) {
      if (data.chime) window.playAlarm();
      alarmTimer = setInterval(() => { if (alarmOn) window.playAlarm(); }, ALARM_EVERY_MS);
    }
  }
  const ALARM_EVERY_MS = 4000;
  let alarmOn = false, alarmTimer = null;
  window.statusApp.onAlertData(render);
</script>
</body>
</html>
