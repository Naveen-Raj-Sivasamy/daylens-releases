        checkBtn.disabled = true; checkBtn.textContent = 'Checking…';
        const r = await window.statusApp.checkAppUpdate().catch(() => null);
        checkBtn.disabled = false; checkBtn.textContent = 'Check for updates';
        showState(r);
      };
      window.statusApp.isUpdateReadyToInstall().then(async (ready) => {
        if (!ready) return;
        const p = await window.statusApp.getPendingUpdate().catch(() => null);
        showState({ state: 'ready', version: (p && p.version) || '' });
      }).catch(() => {});
    } catch (err) {
      showError(err.message || String(err), showAbout);
    }
  }

  // Read-only history of real user actions — app opens, tab-picker
  // clicks, submit/edit/delete attempts (Success AND Failed, e.g. a
  // lock-busy timeout or a rejected duplicate Ticket ID) — see Code.gs's
  // logAudit_/getAuditLogRows_ for exactly what's recorded and why
  // (real actions only, never a background stale-while-revalidate
  // refresh). Fetched fresh every time this screen opens rather than
  // cached — someone chasing down "what happened to X" wants the latest
  // rows, not whatever was cached earlier. logAnalyserRows/
  // logAnalyserStatusFilter live at this scope (not inside the function)
  // so the search box and status pills can re-filter in place via
  // renderLogRows() without re-fetching from the server on every
  // keystroke/click.
  let logAnalyserRows = [];
  let logAnalyserStatusFilter = 'all';

  async function showLogAnalyser() {
    const scr = beginScreen(); // a newer screen takes over: this one stops drawing
    appSection('logs');
    els.footer.classList.add('hidden');
    setScreen('Activity log', []);
    els.main.style.minHeight = '';
    logAnalyserStatusFilter = 'all';
    showLoading('Loading activity…');
    try {
      const res = await window.statusApp.getAuditLog();
      if (scr.stale) return;
      logAnalyserRows = (res && res.rows) || [];
      renderLogAnalyserShell();
    } catch (err) {
      showError(viewRefused(err.message) ? VIEW_NEEDS_UPDATE : err.message || String(err), showLogAnalyser);
    }
  }

  // Builds the filter controls + rows host ONCE per open/refresh — the
  // search input keeps its DOM node (and focus) across every keystroke
  // because only renderLogRows() below touches #log-rows-host afterward,
  // never this shell.
  function renderLogAnalyserShell() {
    els.main.innerHTML = `
      <div class="wc-filter-row" id="log-status-filters">
        <button type="button" class="wc-filter-btn" data-status="all">All</button>
        <button type="button" class="wc-filter-btn" data-status="success">Success</button>
        <button type="button" class="wc-filter-btn" data-status="failed">Failed</button>
      </div>
      <div class="field">
        <input type="text" id="log-search-input" placeholder="Search user, action, tab, or summary…">
      </div>
      <div class="field wc-date-row">
        <input type="date" id="log-date-from" title="From date">
        <input type="date" id="log-date-to" title="To date">
      </div>
      <div id="log-rows-host" class="scroll-list"></div>
      <div style="display:flex; gap:8px; margin-top:4px;">
        <button type="button" class="secondary" id="log-refresh-btn" style="flex:1;">⟳ Refresh</button>
        <button type="button" class="secondary" id="log-export-btn" style="flex:1;">⬇ Export CSV</button>
      </div>
    `;

    document.querySelectorAll('#log-status-filters .wc-filter-btn').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.status === logAnalyserStatusFilter);
      btn.onclick = () => {
        logAnalyserStatusFilter = btn.dataset.status;
        document.querySelectorAll('#log-status-filters .wc-filter-btn').forEach((b) =>
          b.classList.toggle('active', b.dataset.status === logAnalyserStatusFilter)
        );
        renderLogRows();
      };
    });

    document.getElementById('log-search-input').oninput = () => renderLogRows();
    document.getElementById('log-date-from').onchange = () => renderLogRows();
    document.getElementById('log-date-to').onchange = () => renderLogRows();
    document.getElementById('log-refresh-btn').onclick = () => showLogAnalyser();
    document.getElementById('log-export-btn').onclick = () => exportLogRowsCsv();

    renderLogRows();
  }

  // Rows currently on screen (after status/search/date filtering) — kept
  // at this scope so the Export CSV button can read exactly what's
  // visible without recomputing the filter or re-fetching from the
  // server.
  let logAnalyserFilteredRows = [];

  function renderLogRows() {
    const searchInput = document.getElementById('log-search-input');
    const search = (searchInput ? searchInput.value : '').trim().toLowerCase();
    const fromInput = document.getElementById('log-date-from');
    const toInput = document.getElementById('log-date-to');
    const fromDate = fromInput && fromInput.value ? fromInput.value : null;
    const toDate = toInput && toInput.value ? toInput.value : null;

    const filtered = logAnalyserRows.filter((r) => {
      if (logAnalyserStatusFilter === 'failed' && String(r.status).toLowerCase() !== 'failed') return false;
      if (logAnalyserStatusFilter === 'success' && String(r.status).toLowerCase() === 'failed') return false;
      // r.timestamp is "yyyy-MM-dd HH:mm:ss" from the server — its first
      // 10 characters are already an ISO date, so a plain string compare
      // against the <input type="date"> value (also yyyy-MM-dd) works
      // with no parsing.
      const rowDate = String(r.timestamp || '').slice(0, 10);
      if (fromDate && rowDate < fromDate) return false;
      if (toDate && rowDate > toDate) return false;
      if (!search) return true;
      return [r.username, r.action, r.tab, r.summary].some((v) => String(v || '').toLowerCase().includes(search));
    });
    logAnalyserFilteredRows = filtered;

    const host = document.getElementById('log-rows-host');
    host.innerHTML = '';
    if (!filtered.length) {
      const empty = document.createElement('div');
      empty.className = 'entries-empty';
      empty.textContent = logAnalyserRows.length ? 'No activity matches this filter.' : 'No activity recorded yet.';
      host.appendChild(empty);
    } else {
      filtered.forEach((r) => host.appendChild(buildLogCard(r)));
    }
  }

  // CSV of exactly what's currently visible (status pill + search + date
  // range already applied) — an admin narrowing down to one failed action
  // or one week gets a file matching what they were just looking at, not
  // the whole 1000-row window every time.
  function exportLogRowsCsv() {
    if (!logAnalyserFilteredRows.length) {
      window.alert('Nothing to export — adjust the filters first.');
      return;
    }
    const escapeCsv = (v) => {
      const s = String(v == null ? '' : v);
      return /["\n,]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const headerRow = ['Timestamp', 'Username', 'Action', 'Tab', 'Summary', 'Status'];
    const lines = [headerRow.join(',')].concat(
      logAnalyserFilteredRows.map((r) =>
        [r.timestamp, r.username, r.action, r.tab, r.summary, r.status].map(escapeCsv).join(',')
      )
    );
    const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `activity-log-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function buildLogCard(r) {
    const failed = String(r.status).toLowerCase() === 'failed';
    const card = document.createElement('div');
    card.className = 'log-card' + (failed ? ' log-card-failed' : '');
    card.innerHTML = `
      <div class="log-card-top">
        <span class="log-card-when">${escapeHtml(r.timestamp)}</span>
        <span class="badge ${failed ? 'log-failed' : 'log-success'}">${failed ? 'Failed' : 'Success'}</span>
      </div>
      <div class="log-card-main">${escapeHtml(r.username || '(not logged in)')} — ${escapeHtml(r.action || '')}${r.tab ? ' · ' + escapeHtml(r.tab) : ''}</div>
      ${r.summary ? `<div class="log-card-summary">${escapeHtml(r.summary)}</div>` : ''}
    `;
    return card;
  }

  // Which category's tab list is currently showing, if any — so the many
  // existing "go back to the tab list" callbacks (Cancel on a form, retry
  // after an error, Done after a submit, Back from Settings/Report
  // Options) can all keep calling showTabPicker() with no arguments and
  // land back on the right list, instead of every one of those needing to
  // be rewritten to thread the category through by hand.
  let currentCategory = null;

  // Shown instead of the normal landing screen once an admin has created
  // an account for this person (see checkLoginGate below) — until then,
  // this never runs and nothing about the app changes for anyone. No
  // "skip" button on purpose: an account only exists because an admin
  // deliberately created one, so once it does, logging in is the point.
  // Forgot-password/locked-out isn't handled here — that's an admin
  // resetting it (resetUserPassword in Code.gs), not a self-service flow.
  // Set your own password. forced = signed in with a temporary password
  // (new account / admin reset): the app stays locked until it's done.
  function showChangePassword(forced, knownCurrent) {
    appGate(!!forced);
    if (!forced) appSection('settings');
    els.footer.classList.add('hidden');
    setScreen(forced ? 'Set your own password' : 'Change my password', forced ? [] : [{ label: 'Settings', go: () => showSettings() }]);
    els.main.innerHTML = `
      <div class="narrow">
        <p class="login-hint">${forced ? 'You signed in with a temporary password from your admin. Choose your own password to continue — only you will know it.' : 'Choose a new password for this account.'}</p>
        <div class="field" ${knownCurrent ? 'hidden' : ''}><label>${forced ? 'Temporary password' : 'Current password'}</label><input id="cp-current" type="password" autocomplete="current-password" /></div>
        <div class="field"><label>New password (8+ characters)</label><input id="cp-new" type="password" autocomplete="new-password" /></div>
        <div class="field"><label>Repeat new password</label><input id="cp-new2" type="password" autocomplete="new-password" /></div>
        <div class="login-err" id="cp-err"></div>
        <button class="primary" id="cp-save" style="width:100%;">Save my password</button>
        ${forced ? '' : '<button type="button" class="secondary" id="cp-cancel" style="width:100%; margin-top:6px;">Cancel</button>'}
      </div>`;
    if (knownCurrent) document.getElementById('cp-current').value = knownCurrent;
    const err = document.getElementById('cp-err');
    const cancel = document.getElementById('cp-cancel');
    if (cancel) cancel.onclick = showSettings;
    const save = async () => {
      const cur = document.getElementById('cp-current').value;
      const n1 = document.getElementById('cp-new').value;
      const n2 = document.getElementById('cp-new2').value;
      if (!cur) { err.textContent = 'Enter your current password.'; return; }
      if (n1.length < 8) { err.textContent = 'Use at least 8 characters.'; return; }
      if (n1 !== n2) { err.textContent = "The two new passwords don't match."; return; }
      if (n1 === cur) { err.textContent = 'Pick a new password — not the same one.'; return; }
      const b = document.getElementById('cp-save');
      b.disabled = true;
      const out = await window.statusApp.changeMyPassword(cur, n1).catch((e) => ({ ok: false, error: e.message }));
      b.disabled = false;
      if (!out || !out.ok) { err.textContent = (out && out.error) || 'Could not change the password.'; return; }
      appGate(false);
      showResult({ success: true, title: 'Password saved', subtitle: 'Use it next time you sign in.', doneLabel: 'Continue', onDone: forced ? showCategoryPicker : showSettings });
    };
    document.getElementById('cp-save').onclick = save;
    document.getElementById('cp-new2').onkeydown = (e) => { if (e.key === 'Enter') save(); };
    (knownCurrent ? document.getElementById('cp-new') : document.getElementById('cp-current')).focus();
  }

  // The backend rejected this app's token (usually: the team's
  // SHARED_SECRET was changed). Nothing can be saved, and nobody can log
  // in, until it's fixed — say so up front instead of failing on Save.
  function showConnectionBroken() {
    appGate(true);
    els.footer.classList.add('hidden');
    setScreen('Connection out of date', []);
    els.main.innerHTML = `
      <div class="narrow" style="max-width:560px;">
        <p class="login-hint">This app's connection to your team's Sheet is out of date — the Sheet rejected its token (this happens when the team's secret is changed). Nothing can be saved or logged in until it's updated.</p>
        <div id="broken-host"></div>
        <button type="button" class="secondary" id="broken-retry">Try again</button>
      </div>`;
    document.getElementById('broken-host').appendChild(tileGrid([
      makeTile({ id: 'login-fix-connection', icon: '🔗', title: 'Fix connection', hint: 'Re-join your team, or paste the new Token (Apps Script → Project Settings → Script Properties → SHARED_SECRET)',
        onClick: () => window.__appMode && window.__appPost({ type: 'open-section', name: 'connect', force: true }) }),
    ], true));
    document.getElementById('broken-retry').onclick = async () => { if (!(await checkLoginGate())) showCategoryPicker(); };
  }

  // optional = opened by choice (Settings → Log in / the sidebar chip):
  // no sidebar lock, and a "Not now" button. Otherwise it's the required
  // gate (RequireLogin on, or this PC's name has an account).
  async function showLoginGate(suggestedUsername, optional) {
    appGate(!optional);
    els.footer.classList.add('hidden');
    setScreen('Sign in', []);
    els.main.style.minHeight = '';
    const team = await window.statusApp.getTeamInfo().catch(() => ({}));
    const teamLabel = team.teamName || team.teamId || "your team";
    els.main.innerHTML = `
      <div class="narrow">
        <div class="team-badge" id="login-team">🏢 Team: <b>${escapeHtml(teamLabel)}</b> <button type="button" class="link-inline" id="login-switch-team">Other teams</button></div>
        <p class="login-hint">Sign in with the username and password your admin gave you. You'll stay signed in on this computer until you log out.</p>
        <div class="field"><label>Username</label><input id="login-username" autocomplete="username" /></div>
        <div class="field"><label>Password</label><input id="login-password" type="password" autocomplete="current-password" /></div>
        <div class="login-err" id="login-err"></div>
        <button class="primary" id="login-submit-btn" style="width:100%;">Log in</button>
        ${optional ? '<button type="button" class="secondary" id="login-skip-btn" style="width:100%; margin-top:6px;">Not now</button>' : ''}
        <p class="login-hint" style="margin-top:14px;">No account yet, or forgot your password? Ask your admin, or use "Contact Admin" below.</p>
        <div id="login-fix-host"></div>
      </div>
    `;
    const userEl = document.getElementById('login-username');
    const passEl = document.getElementById('login-password');
    const errEl = document.getElementById('login-err');
    const btn = document.getElementById('login-submit-btn');
    userEl.value = suggestedUsername || '';

    async function attemptLogin() {
      const username = userEl.value.trim();
      const password = passEl.value;
      if (!username || !password) {
        errEl.textContent = 'Enter your username and password.';
        return;
      }
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Logging in…';
      let result;
      try {
        result = await window.statusApp.login(username, password);
      } catch (err) {
        result = { ok: false, error: err.message || String(err) };
      }
      btn.disabled = false;
      btn.textContent = 'Log in';
      if (!result || !result.ok) {
        const msg = (result && result.error) || 'Login failed — please try again.';
        errEl.textContent = msg;
        // The backend rejecting our shared TOKEN means NOBODY can log in
        // until the connection is fixed — offer the way out right here
        // (the Organization connection screen allows this case without an
        // admin login; see get-admin-status in main.js).
        if (/invalid token/i.test(msg)) {
          errEl.textContent = "This app's connection to the Sheet is out of date (the backend rejected its token), so nobody can log in yet.";
          const host = document.getElementById('login-fix-host');
          host.innerHTML = '';
          host.appendChild(tileGrid([
            makeTile({ id: 'login-fix-connection', icon: '🔗', title: 'Fix organization connection', hint: 'Enter the current Token from Apps Script → Project Settings → Script Properties (SHARED_SECRET)',
              onClick: () => window.__appMode && window.__appPost({ type: 'open-section', name: 'connect', force: true }) }),
          ], true));
        }
        return;
      }
      if (window.__appMode) window.__appPost({ type: 'session-changed' });
      yourName = await window.statusApp.getYourName();
      refreshLiveData();
      if (result.mustChangePassword) return showChangePassword(true, password);
      // Signed in with an old name — the admin renamed the account.
      if (result.renamedFrom) {
        showResult({ success: true, title: `You're "${result.username}" now`, subtitle: `Your admin renamed your account from "${result.renamedFrom}". Sign in as "${result.username}" from now on — same password.`, doneLabel: 'Continue', onDone: showCategoryPicker });
        return;
      }
      showCategoryPicker();
    }

    btn.onclick = attemptLogin;
    passEl.onkeydown = (e) => { if (e.key === 'Enter') attemptLogin(); };
    const skip = document.getElementById('login-skip-btn');
    if (skip) skip.onclick = () => showCategoryPicker();

    // The team switcher: your other teams on this PC, or join/create one.
    document.getElementById('login-switch-team').onclick = () =>
      window.__appMode && window.__appPost({ type: 'open-team-switcher' });
  }

  async function checkLoginGate() {
    try {
      const status = await window.statusApp.getSessionStatus({ check: true });
      if (status && status.connectionBroken) {
        showConnectionBroken();
        return true;
      }
      if (status && status.loggedIn && status.mustChangePassword) {
        showChangePassword(true);
        return true;
      }
      // accountExists: the per-person rollout (an admin created THIS
      // name's account specifically). requireLogin: the later, global
      // switch (_Config's RequireLogin) — once an admin turns that on,
      // everyone gets gated regardless of whether their saved name
      // happens to match an account, not just the ones that do.
      // Optional for now: only gate when the backend says login is
      // required (RequireLogin) or an account exists for this PC's name.
      if (status && !status.loggedIn && (status.accountExists || status.requireLogin)) {
        showLoginGate(status.suggestedUsername);
        return true;
      }
    } catch {
      /* best-effort — fall through to the normal screen */
    }
    return false;
  }

  // The landing screen: one big button per category from the _Categories
  // sheet tab (see groupTabsIntoCategories() in field-config.js), instead
  // of a single flat list of every tab. An org that hasn't configured any
  // categories at all gets no cards here — showTabPicker() below renders
  // the flat list directly instead, same as this app's very first screen
  // ever, before categories existed.
  // Last category grouping shown — lets the main window's sidebar jump
  // straight into one category (see the 'nav' message handler below).
  let lastCategoryGroups = [];

  async function showCategoryPicker() {
    const scr = beginScreen(); // a newer screen takes over: this one stops drawing
    if (lastTooOld) { showAppTooOld(lastTooOld); return; }
    currentCategory = null;
    appGate(false);
    appSection('home');
    setScreen('What would you like to do?', []);
    els.footer.classList.add('hidden');
    showLoading('Loading…');
    try {
      const [{ tabs }, categoriesRes] = await Promise.all([
        window.statusApp.getTabs(),
        window.statusApp.getCategories(),
        loadIcons(),
      ]);
      if (scr.stale) return;
      liveCategories = (categoriesRes && categoriesRes.categories) || {};
      const groups = groupTabsIntoCategories(tabs, liveCategories);
      lastCategoryGroups = groups;

      if (!tabs.length) {
        // A brand-new team: nothing to log into yet.
        const st = await window.statusApp.getSessionStatus().catch(() => ({}));
        const isAdmin = st && st.loggedIn && st.role === 'Admin';
        els.main.innerHTML = `<div class="narrow" style="max-width:620px;"><p class="login-hint" id="no-tabs-msg">${isAdmin
          ? 'Your team has no tabs yet. A tab is one thing your team logs — daily status, leave, tickets, meeting notes… Start from a template:'
          : "Your team's admin hasn't added any tabs yet. Check back soon."}</p></div>`;
        if (isAdmin) {
          els.main.firstElementChild.appendChild(tileGrid([
            makeTile({ id: 'add-first-tab', icon: '＋', title: 'Add your first tab', hint: 'Daily status, Leave, Ticket tracker, Weekly meeting or Custom', variant: 'add',
              onClick: () => window.__appMode && window.__appPost({ type: 'open-section', name: 'manage', sub: 'tabs-section' }) }),
          ], true));
        }
        return;
      }
      if (groups.length === 0) {
        // Nothing configured on _Categories — skip this screen entirely.
        showTabPicker({ name: null, tabs });
        return;
      }

      els.main.innerHTML = '';
      // Home. Classic (default): categories on the left, the team dashboard
      // on the right. Trendy (1.5): the dashboard is the page — the week in a
      // sentence, the categories (and the leave calendar), then the numbers.
      let homeHost = els.main;
      if (tabTypesLoaded) await tabTypesLoaded;
      if (scr.stale) return;
      const ticketTabs = tabs.filter((t) => isTicketTab(t) && liveDataSourceTypes[t] !== 'Excel');
      const leaveTab = tabs.find((t) => liveTabTypes[t] === 'leave');
      const trendy = isTrendy();
      const dashLinks = {
        ticketTabs: ticketTabs.length,
        onOpenBoard: (o) => ticketTabs.length && showTicketBoard((o && o.tab) || ticketTabs[0], o && o.stuck ? { stuck: true } : null),
        onOpenTicket: (item) => openTicketFromDash(item),
      };
      if (window.__appMode) els.main.appendChild(lookSwitchEl());
      if (window.__appMode && !trendy && window.DaylensDashboardClassic) {
        const split = document.createElement('div');
        split.className = 'home-split dc';
        homeHost = document.createElement('div');
        homeHost.className = 'home-main';
        const dash = document.createElement('aside');
        dash.className = 'home-dash';
        dash.id = 'home-dash';
        dash.setAttribute('aria-label', 'Team dashboard');
        split.appendChild(homeHost);
        split.appendChild(dash);
        els.main.appendChild(split);
        window.statusApp.getSessionStatus().catch(() => ({})).then((st) => {
          if (document.body.contains(dash)) window.DaylensDashboardClassic.render(dash, Object.assign({ isAdmin: !!(st && st.role === 'Admin'), onUpdate: () => showAbout() }, dashLinks));
        });
      } else if (window.__appMode && window.DaylensDashboard) {
        setScreen('', []); // the dashboard's own sentence is the page's title
        const dash = document.createElement('section');
        dash.className = 'home-dash d2';
        dash.id = 'home-dash';
        dash.dataset.look = DASH_LOOK;
        dash.setAttribute('aria-label', 'Team dashboard');
        dash.innerHTML = '<div class="d2-hero"></div><div class="home-main"></div><div class="d2-body"></div>';
        homeHost = dash.querySelector('.home-main');
        els.main.appendChild(dash);
        window.statusApp.getSessionStatus().catch(() => ({})).then((st) => {
          if (!document.body.contains(dash)) return;
          window.DaylensDashboard.render(dash, Object.assign({}, dashLinks, {
            isAdmin: !!(st && st.role === 'Admin'),
            canApprove: !!(st && st.role === 'Admin'),
            hasLeave: !!leaveTab,
            onUpdate: () => showAbout(),
            onOpenLeave: () => showLeaveCalendar(leaveTab),
            onApprovals: () => window.__appPost && window.__appPost({ type: 'open-section', name: 'approvals' }),
            onHolidays: (y) => { lcState.tab = leaveTab || lcState.tab; showHolidayEditor(y, { year: -1 }); },
          }));
        });
      }
      homeHost.appendChild(todayStripEl());
      renderTodayStrip();
      showSheetNudge();
      // App mode lays the cards out in a responsive grid; the popup keeps
      // its single stacked column (the wrapper has no styling there).
      const homeTiles = groups.map((group) => makeTile({
        icon: iconForName(group.name, 'category'),
        title: group.name,
        hint: group.tabs.join(', '),
        onClick: () => showTabPicker(group),
      }));
      if (leaveTab && window.__appMode && trendy) homeTiles.push(makeTile({ id: 'home-leave-cal', icon: '📅', title: 'Leave calendar', hint: 'Who\'s off, and when', onClick: () => { lcState.person = ''; if (lcState.view === 'list') lcState.view = 'month'; showLeaveCalendar(leaveTab); } }));
      homeHost.appendChild(tileGrid(homeTiles, true));

      // Size to actual content, same as every other screen — a fixed
      // floor here used to force this box to a hand-picked height (chosen
      // to match whatever the "tallest" menu screen looked like at the
      // time) even when there were only 1-2 categories, which just added
      // dead space instead of adapting. The ResizeObserver at the bottom
      // of this file already keeps the real OS window fit to content, so
      // there's nothing this floor was protecting against.
      els.main.style.minHeight = '';
    } catch (err) {
      showError(err.message || String(err), showCategoryPicker);
    }
  }

  // Admins: "Your team's Sheet has an update" on Home while it's behind
  // the app — new features (and the fixes that keep older and newer
  // Daylens versions saving the same way) need it. "Later" hides it until
  // the app next opens.
  let sheetNudgeHidden = false;
  async function showSheetNudge() {
    if (sheetNudgeHidden) return;
    const st = await window.statusApp.getSessionStatus().catch(() => ({}));
    if (!st || !st.loggedIn || st.role !== 'Admin') return;
    const b = await window.statusApp.getBackendStatus({ cached: true }).catch(() => null);
    if (!b || !b.ok || !b.updateAvailable || document.getElementById('sheet-nudge')) return;
    const strip = document.querySelector('#main .today-strip');
    if (!strip || !document.body.contains(strip)) return; // moved on meanwhile
    const n = document.createElement('div');
    n.className = 'sheet-nudge';
    n.id = 'sheet-nudge';
    n.setAttribute('role', 'status');
    n.innerHTML = `<span class="sn-ic">⬆</span><span class="grow"><b>Your team's Sheet has an update</b> — v${escapeHtml(b.current || '?')} → v${escapeHtml(b.latest)}. New features need it; it takes a minute and nobody else has to do anything.</span>
      <button type="button" class="mini-btn go" id="sheet-nudge-go">Update now</button><button type="button" class="mini-btn" id="sheet-nudge-later">Later</button>`;
    strip.insertAdjacentElement('beforebegin', n);
    n.querySelector('#sheet-nudge-go').onclick = () => showAbout();
    n.querySelector('#sheet-nudge-later').onclick = () => { sheetNudgeHidden = true; n.remove(); };
  }

  // Lets footer.js's injected logo mark act as a "Home" button — see its
  // own comment on window.__kcGoHome for why this is set per-page instead
  // of footer.js hardcoding what "home" means.
  window.__kcGoHome = showCategoryPicker;

  // Renders one category's tab list — or, when `group.name` is `null`
  // (no _Categories configured at all, see showCategoryPicker above), the
  // full flat tab list with no "Back" button, since there's no category
  // screen to go back to. `group` is only ever a real {name, tabs} object
  // when called from showCategoryPicker's own click handler above (an
  // arrow function, so it passes the real value) or its own flat-list
  // fallback call — every other call site assigns this function straight
  // to an `onclick`/`onDone`, which invokes it with the DOM event as the
  // first argument instead. The typeof/Array.isArray check below is what
  // tells those apart, so a bare `showTabPicker()` (or
  // `showTabPicker(event)`) safely falls back to whichever tab list was
  // already showing.
  function showTabPicker(group) {
    if (group && typeof group === 'object' && Array.isArray(group.tabs)) {
      currentCategory = group;
    }
    group = currentCategory;
    if (!group) return showCategoryPicker(); // nothing to go "back" to — land on the real start screen instead

    const isFlat = group.name === null;
    appSection('home', { category: isFlat ? null : group.name });
    setScreen(isFlat ? 'What are you logging status for?' : `${group.name} — choose an option`, isFlat ? [] : [{ label: 'Home', go: () => showCategoryPicker() }]);
    els.footer.classList.add('hidden');
    els.main.style.minHeight = ''; // size to content — see the comment in showCategoryPicker() above
    els.main.innerHTML = '';
    if (isFlat) { els.main.appendChild(todayStripEl()); renderTodayStrip(); } // Home itself when there are no categories

    const tabHint = (tab) => {
      if (isMeetingTab(tab)) return 'Log one meeting and all its queries';
      if (isTicketTab(tab)) return 'Raise a ticket, or view & update existing ones';
      if (liveDataSourceTypes[tab] === 'Excel') return 'Add a new entry';
      return 'View, add & edit entries';
    };
    els.main.appendChild(tileGrid(group.tabs.map((tab) => {
      // Weekly Connect keeps going straight to its own add-a-ticket form
      // (with the "View & update tickets" tile to its specialized
      // status/priority list). A tab routed to Excel (see
      // liveDataSourceTypes/_DataSources) can't be read back yet either —
      // only new entries go through, so it also skips straight to the
      // form. Every other tab opens the generic existing-entries list.
      return makeTile({
        icon: iconForName(tab, 'tab'),
        title: tab,
        hint: tabHint(tab),
        onClick: () => openTab(tab),
      });
    })));
    // No "← Back" here any more — the sidebar's Home / category links
    // already do that from every screen.
  }

  // Home's Today strip: the first few items of the bell's list (who's on
  // leave, holiday, team message, your due reminders), each dismissable;
  // "Show all" opens the bell panel. Hidden when there's nothing.
  async function renderTodayStrip() {
    const host = document.getElementById('today-strip');
    if (!host) return;
    const res = await window.statusApp.getToday().catch(() => ({ items: [] }));
    const items = (res && res.items) || [];
    if (!document.body.contains(host)) return;
    host.hidden = !items.length;
    if (!items.length) { host.innerHTML = ''; return; }
    host.innerHTML = `<div class="today-strip-head"><b>Today</b><span>${escapeHtml(new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }))}</span></div><div id="today-strip-list"></div>`;
    window.TodayList.render(document.getElementById('today-strip-list'), items, {
      limit: 3,
      onMore: () => window.__appMode && window.__appPost({ type: 'open-today' }),
    });
  }
  function todayStripEl() {
    const d = document.createElement('div');
    d.className = 'today-strip';
    d.id = 'today-strip';
    d.hidden = true;
    d.setAttribute('aria-label', 'Today');
    return d;
  }
  window.statusApp.onTodayChanged(() => renderTodayStrip());

  // Search everything (the box at the top): opens the row it found. The row
  // is read fresh, so the edit screen shows what's in the Sheet right now.
  async function openSearchHit(tab, rowIndex, title) {
    const scr = beginScreen(); // a newer screen takes over: this one stops drawing
    if (!tab) return showCategoryPicker();
    setScreen(tab, tabTrail());
    showLoading('Opening…');
    try {
      const res = await window.statusApp.getTabRows(tab);
      if (scr.stale) return;
      const rows = (res && res.rows) || [];
      const row = rows.find((r) => Number(r.rowIndex) === Number(rowIndex));
      if (row) return showEntryEdit(tab, row);
      renderTabEntries(tab, rows, res); // it moved or went since the search: the tab's list instead
    } catch (err) {
      showError(err.message || String(err), () => openSearchHit(tab, rowIndex, title));
    }
  }
  if (window.__appMode) {
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && !e.altKey && String(e.key).toLowerCase() === 'k') { e.preventDefault(); window.__appPost({ type: 'focus-search' }); }
    });
  }



  // -------------------- Team directory screen (1.5.1) --------------------
  // Everyone the team works with, in groups. Admins add people (one name a
  // line, or pasted from a sheet), set their groups, and retire or remove
  // them — or whole groups — so they stop being offered. Daylens accounts
  // are in it by themselves (their on/off is set in People). Teammates look.
  const dirState = { group: '', q: '', showOff: false };
  async function showDirectory(message) {
    const scr = beginScreen(); // a newer screen takes over: this one stops drawing
    appSection('users');
    els.footer.classList.add('hidden');
    els.main.style.minHeight = '';
    setScreen('Team directory', [{ label: 'People', go: () => showUsers() }]);
    showLoading('Loading the team directory…');
    const d = await window.statusApp.getDirectory().catch((e) => ({ ok: false, error: e.message }));
    if (scr.stale) return;
    if (!d || !d.ok) {
      showError(/update/i.test(String(d && d.error)) ? 'The team directory needs the latest update of your team\'s Sheet. An admin can install it in Settings → About Daylens → Update.' : ((d && d.error) || 'Couldn\'t load the team directory.'), () => showDirectory());
      return;
    }
    const admin = !d.viewOnly;
    const groups = d.groups || [];
    const people = d.people || [];
    const live = (g) => g.status === 'Active';
    els.main.innerHTML = `
      ${admin ? '' : '<div class="vo-banner" role="note"><span aria-hidden="true">👁</span><span><b>View only.</b> Only an admin can change the team directory.</span></div>'}
      <p class="login-hint">Everyone your team works with, in groups. A "Pick one" or "Pick several" field can offer these names instead of a typed list (set it in Tabs &amp; fields). Retired or removed people and groups aren't offered any more; old entries keep their names.</p>
      <div class="inline-msg ${message && message.err ? 'err' : 'ok'}" id="dir-msg" role="status">${escapeHtml((message && message.text) || '')}</div>
      <div id="dir-typed-host"></div>
      <div id="dir-add-host"></div>
      <div class="dir-groups" id="dir-groups" role="group" aria-label="Show a group"></div>
      <div id="dir-group-tools"></div>
      <div class="dir-tools"><input type="search" id="dir-q" placeholder="Find a name" aria-label="Find a name" value="${escapeHtml(dirState.q)}" />
        <label><input type="checkbox" id="dir-off" ${dirState.showOff ? 'checked' : ''} /> Show retired and removed</label></div>
      <div id="dir-list" class="scroll-list"></div>`;
    const msg = (text, err) => { const m = document.getElementById('dir-msg'); m.className = 'inline-msg ' + (err ? 'err' : 'ok'); m.textContent = text; };
    const run = async (fn, okText) => {
      const r = await fn().catch((e) => ({ ok: false, error: e.message }));
      if (!r || !r.ok) { msg(friendlyBackendError(r && r.error, 'That didn\'t save.'), true); return false; }
      showDirectory({ text: typeof okText === 'function' ? okText(r) : okText });
      return true;
    };

    // Names typed under "Other…" that the directory doesn't know (admins).
    if (admin && (d.typed || []).length) {
      const box = document.createElement('div');
      box.className = 'card dir-typed';
      box.id = 'dir-typed';
      box.innerHTML = `<div class="card-title">Typed under "Other…" (${d.typed.length})</div>
        <div class="card-sub">Names people typed that aren't in the directory. Add them to a group so they can be picked next time, or ignore them.</div>
        <ul>${d.typed.map((t, i) => `<li class="card-row" data-i="${i}"><span class="grow"><b>${escapeHtml(t.name)}</b> <span class="card-sub">— ${escapeHtml(t.tab || '')}${t.column ? ' → ' + escapeHtml(t.column) : ''}${t.count > 1 ? `, ${t.count} times` : ''}</span></span>
          <select class="dir-typed-group" aria-label="Group for ${escapeHtml(t.name)}"><option value="">No group</option>${groups.filter(live).map((g) => `<option>${escapeHtml(g.name)}</option>`).join('')}</select>
          <button type="button" class="mini-btn go dir-typed-add">Add</button><button type="button" class="mini-btn dir-typed-ignore">Ignore</button></li>`).join('')}</ul>`;
      document.getElementById('dir-typed-host').appendChild(box);
      box.querySelectorAll('li').forEach((li) => {
        const t = d.typed[Number(li.dataset.i)];
        li.querySelector('.dir-typed-add').onclick = () => {
          const g = li.querySelector('.dir-typed-group').value;
          run(() => window.statusApp.addDirectoryPeople([t.name], g ? [g] : []), `${t.name} added${g ? ' to ' + g : ''}.`);
        };
        li.querySelector('.dir-typed-ignore').onclick = () => run(() => window.statusApp.ignoreTypedName(t.name), `${t.name} won't be listed here again.`);
      });
    }

    // Add people (admins).
    if (admin) {
      const tile = makeTile({ id: 'dir-add-tile', icon: '＋', title: 'Add people', hint: 'Type or paste names, one a line, and pick their groups', variant: 'add' });
      const host = document.getElementById('dir-add-host');
      host.appendChild(tileGrid([tile], true));
      tile.onclick = () => {
        host.innerHTML = `<div class="card" id="dir-add-card">
          <div class="card-title" style="margin-bottom:8px;">Add people</div>
          <textarea id="dir-add-names" rows="4" placeholder="One name a line — or paste a column from a sheet" aria-label="Names, one a line"></textarea>
          <div class="card-sub" style="margin:10px 0 6px;">Their groups — pick any, or type a new one (e.g. Client, Vendor, Migration team):</div>
          <div id="dir-add-groups"></div>
          <div class="card-row" style="margin-top:10px;"><button type="button" class="mini-btn go" id="dir-add-save">Add to the directory</button><button type="button" class="mini-btn" id="dir-add-cancel">Cancel</button></div>
        </div>`;
        const gp = groupPicker(groups, dirState.group && dirState.group !== '*accounts' ? [dirState.group] : []);
        document.getElementById('dir-add-groups').appendChild(gp);
        document.getElementById('dir-add-names').focus();
        document.getElementById('dir-add-cancel').onclick = () => showDirectory();
        document.getElementById('dir-add-save').onclick = () => {
          const names = document.getElementById('dir-add-names').value.split(/\n/).map((x) => x.trim()).filter(Boolean);
          if (!names.length) return msg('Type at least one name.', true);
          run(() => window.statusApp.addDirectoryPeople(names, gp.value), (r) => r.message || 'Added.');
        };
      };
    }

    // Groups: click one to see only its people.
    const counts = { all: people.filter((p) => p.status === 'Active').length, accounts: d.accounts || 0 };
    const gHost = document.getElementById('dir-groups');
    const chips = [['', `Everyone (${counts.all})`, '']].concat([['*accounts', `${d.accountsGroup || 'Daylens users'} (${counts.accounts})`, '']])
      .concat(groups.filter((g) => g.status !== 'Removed' || dirState.showOff).map((g) => [g.name, `${g.name} (${g.members})`, g.status !== 'Active' ? 'retired' : '']));
    gHost.innerHTML = chips.map(([v, l, cls]) => `<button type="button" class="chip ${cls} ${dirState.group === v ? 'selected' : ''}" data-g="${escapeHtml(v)}" aria-pressed="${dirState.group === v}">${escapeHtml(l)}</button>`).join('');
    gHost.querySelectorAll('.chip').forEach((b) => { b.onclick = () => { dirState.group = b.dataset.g; showDirectory(); }; });
    // A group's own status (admins): retire a temporary team when it's done.
    const curGroup = groups.find((g) => g.name === dirState.group);
    if (admin && curGroup) {
      const t = document.getElementById('dir-group-tools');
      t.className = 'card-row';
      t.style.marginBottom = '10px';
      const setGroup = (status) => run(() => window.statusApp.saveDirectoryGroups(groups.map((g) => ({ name: g.name, status: g.name === curGroup.name ? status : g.status }))),
        status === 'Active' ? `${curGroup.name} is back.` : `${curGroup.name} is ${status.toLowerCase()} — its people aren't offered through it any more.`);
      t.innerHTML = `<span class="card-sub grow">Group <b>${escapeHtml(curGroup.name)}</b>: ${escapeHtml(curGroup.status)}${curGroup.status === 'Active' ? '' : ' — not offered on forms'}</span>
        ${curGroup.status === 'Active' ? '<button type="button" class="mini-btn" id="dir-g-retire">Retire this group</button><button type="button" class="mini-btn danger" id="dir-g-remove">Remove this group</button>' : '<button type="button" class="mini-btn go" id="dir-g-restore">Bring it back</button>'}`;
      const b1 = t.querySelector('#dir-g-retire'), b2 = t.querySelector('#dir-g-remove'), b3 = t.querySelector('#dir-g-restore');
      if (b1) b1.onclick = () => setGroup('Retired');
      if (b2) b2.onclick = () => setGroup('Removed');
      if (b3) b3.onclick = () => setGroup('Active');
    }

    // The people.
    const listEl = document.getElementById('dir-list');
    const draw = () => {
      const qk = nameKey(dirState.q);
      const shown = people.filter((p) => {
        if (!dirState.showOff && p.status !== 'Active') return false;
        if (dirState.group === '*accounts' && !p.account) return false;
        if (dirState.group && dirState.group !== '*accounts' && !p.groups.some((g) => g.toLowerCase() === dirState.group.toLowerCase())) return false;
        return !qk || nameKey(p.name).includes(qk);
      });
      listEl.innerHTML = shown.length ? '' : `<p class="login-hint">${people.length ? 'No one matches.' : 'No one here yet.' + (admin ? ' Press "Add people" above.' : '')}</p>`;
      shown.forEach((p) => {
        const card = document.createElement('div');
        card.className = 'card dir-person' + (p.status !== 'Active' ? ' is-off' : '');
        card.dataset.name = p.name;
        const statusLabel = p.account ? (p.status === 'Active' ? 'Active' : 'Inactive') : p.status;
        card.innerHTML = `<div class="card-row">
            <span class="avatar-sm">${escapeHtml(p.name.slice(0, 2).toUpperCase())}</span>
            <div class="grow"><div class="card-title">${escapeHtml(p.name)}${p.account ? '<span class="dir-badge" title="Has a Daylens account">Daylens user</span>' : ''}</div>
              <div class="card-sub"><span class="grp-chips">${p.groups.map((g) => `<span class="gchip">${escapeHtml(g)}</span>`).join('') || 'No group'}</span>${p.note ? ' · ' + escapeHtml(p.note) : ''}</div></div>
            <span class="pill ${p.status === 'Active' ? 'user' : 'off'}">${escapeHtml(statusLabel)}</span>
            ${admin ? `<button type="button" class="mini-btn dir-groups-btn">Groups</button>
              ${p.account ? '<span class="card-sub" title="Switch accounts on or off in People">on/off in People</span>' : p.status === 'Active'
                ? '<button type="button" class="mini-btn dir-retire">Retire</button><button type="button" class="mini-btn danger dir-remove">Remove</button>'
                : '<button type="button" class="mini-btn go dir-restore">Bring back</button>'}` : ''}
          </div>
          <div class="dir-edit" hidden></div>`;
        if (admin) {
          const edit = card.querySelector('.dir-edit');
          let gp = null;
          card.querySelector('.dir-groups-btn').onclick = () => {
            edit.hidden = !edit.hidden;
            if (!edit.hidden && !gp) {
              gp = groupPicker(groups, p.groups);
              edit.appendChild(gp);
              const row = document.createElement('div');
              row.className = 'card-row';
              row.style.marginTop = '8px';
              row.innerHTML = '<button type="button" class="mini-btn go dir-groups-save">Save groups</button>';
              edit.appendChild(row);
              row.querySelector('.dir-groups-save').onclick = () => run(() => window.statusApp.updateDirectoryPerson({ name: p.name, groups: gp.value }), `${p.name}: ${gp.value.length ? gp.value.join(', ') : 'no group'}.`);
            }
          };
          const st = (status, text) => () => run(() => window.statusApp.updateDirectoryPerson({ name: p.name, status }), text);
          const r1 = card.querySelector('.dir-retire'), r2 = card.querySelector('.dir-remove'), r3 = card.querySelector('.dir-restore');
          if (r1) r1.onclick = st('Retired', `${p.name} is retired — not offered on forms any more. Old entries keep the name.`);
          if (r2) r2.onclick = st('Removed', `${p.name} is removed — not offered on forms any more. Old entries keep the name.`);
          if (r3) r3.onclick = st('Active', `${p.name} is back.`);
        }
        listEl.appendChild(card);
      });
    };
    document.getElementById('dir-q').oninput = (e) => { dirState.q = e.target.value; draw(); };
    document.getElementById('dir-off').onchange = (e) => { dirState.showOff = e.target.checked; showDirectory(); };
    draw();
  }

  // -------------------- Document Centre (1.5.1) --------------------
  // The team's documents in one place: links (SharePoint, OneDrive, Google
  // Drive, any web page) in categories, each with what it's for (ⓘ). A click
  // opens it. Admins add, edit, move and remove them, and manage the
  // categories; a document can be for admins only. Admins also find the
  // team's Google Sheet and its monthly copies here.
  const docState = { q: '', editing: null, cats: false };
  // A small sign of what the link is (from its address).
  function docIcon(link) {
    const l = String(link || '').toLowerCase();
    if (/:x:|\.xlsx?\b|\.csv\b|\/spreadsheets\//.test(l)) return '📊';
    if (/:w:|\.docx?\b|\/document\//.test(l)) return '📝';
    if (/:p:|\.pptx?\b|\/presentation\//.test(l)) return '📽';
    if (/:b:|\.pdf\b/.test(l)) return '📕';
    if (/:f:|\/folders?\//.test(l)) return '📁';
    if (/sharepoint|onedrive|1drv\.ms/.test(l)) return '🗂';
    return '🔗';
  }
  function docHost(link) {
    try { return new URL(link).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
  }
  async function showDocuments(message) {
    const scr = beginScreen(); // a newer screen takes over: this one stops drawing
    appSection('documents');
    els.footer.classList.add('hidden');
    els.main.style.minHeight = '';
    setScreen('Document Centre', []);
    if (!document.getElementById('doc-list')) showLoading('Loading documents…');
    const d = await window.statusApp.getDocuments(!!(message && message.fresh)).catch((e) => ({ ok: false, error: e.message }));
    if (scr.stale) return;
    if (!d || !d.ok) {
      showError(/update/i.test(String(d && d.error)) ? 'The Document Centre needs the latest update of your team\'s Sheet. An admin can install it in Settings → About Daylens → Update.' : ((d && d.error) || 'Couldn\'t load the documents.'), () => showDocuments());
      return;
    }
    const admin = !!d.admin;
    const docs = d.docs || [];
    const cats = d.categories || [];
    els.main.innerHTML = `
      <p class="login-hint">Your team's documents in one place. Click one to open it; ⓘ says what it's for. Ask Daylens and the search box at the top find them too.</p>
      <div class="inline-msg ${message && message.err ? 'err' : 'ok'}" id="doc-msg" role="status">${escapeHtml((message && message.text) || '')}</div>
      <div class="doc-tools"><input type="search" id="doc-q" placeholder="Find a document" aria-label="Find a document" value="${escapeHtml(docState.q)}" />
        ${admin ? '<button type="button" class="mini-btn go" id="doc-add">+ Add document</button><button type="button" class="mini-btn" id="doc-cats-btn">Categories</button>' : ''}</div>
      <div id="doc-edit-host"></div>
      <div id="doc-list"></div>`;
    const msg = (text, err) => { const m = document.getElementById('doc-msg'); m.className = 'inline-msg ' + (err ? 'err' : 'ok'); m.textContent = text; };
    const open = async (id) => {
      const r = await window.statusApp.openDocument(id).catch((e) => ({ ok: false, error: e.message }));
      if (!r || !r.ok) msg((r && r.error) || 'Couldn\'t open it.', true);
    };
    const list = document.getElementById('doc-list');
    const card = (doc, team) => `
      <div class="doc-card" data-id="${escapeHtml(doc.id)}">
        <button type="button" class="doc-open" title="Open ${escapeHtml(doc.title)}"><span class="doc-ic" aria-hidden="true">${team ? (doc.id === 'sheet' ? '📗' : '🗄') : docIcon(doc.link)}</span>
          <span class="doc-txt"><b>${escapeHtml(doc.title)}</b><small><span class="doc-host">${escapeHtml(docHost(doc.link))}</span>${doc.audience === 'Admins' ? '<span class="doc-admins">admins only</span>' : ''}</small></span></button>
        <button type="button" class="doc-info" aria-expanded="false" aria-label="What ${escapeHtml(doc.title)} is for" title="What it's for">ⓘ</button>
        ${admin && !team ? '<button type="button" class="doc-more" aria-label="Edit, move or remove" title="Edit, move or remove">⋯</button>' : ''}
        <div class="doc-purpose" hidden>${doc.purpose ? escapeHtml(doc.purpose) : '<i>No note on what it\'s for yet.</i>'}</div>
        ${admin && !team ? `<div class="doc-actions" hidden>
          <button type="button" class="mini-btn doc-edit">Edit</button>
          <label class="doc-move-l">Move to <select class="doc-move">${cats.map((c) => `<option ${c === doc.category ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}</select></label>
          <button type="button" class="mini-btn danger doc-del">Remove</button></div>` : ''}
      </div>`;
    const draw = () => {
      const words = docState.q.toLowerCase().split(/\s+/).filter(Boolean);
      const hit = (x) => !words.length || words.every((w) => [x.title, x.category, x.purpose, docHost(x.link)].join(' ').toLowerCase().includes(w));
      const shown = docs.filter(hit);
      let html = '';
      cats.forEach((c) => {
        const inCat = shown.filter((x) => x.category === c);
        if (!inCat.length && (words.length || !admin)) return;
        html += `<section class="doc-cat" data-cat="${escapeHtml(c)}"><h3>${escapeHtml(c)} <span>${inCat.length}</span></h3>
          ${inCat.length ? `<div class="doc-grid">${inCat.map((x) => card(x)).join('')}</div>` : '<p class="doc-empty">Nothing here yet.</p>'}</section>`;
      });
      const team = (d.team || []).filter(hit);
      if (admin && team.length) html += `<section class="doc-cat doc-team"><h3>The team's Google Sheet <span class="doc-admins">admins only</span></h3><div class="doc-grid">${team.map((x) => card(x, true)).join('')}</div></section>`;
      list.innerHTML = html || `<p class="login-hint">${docs.length ? 'No document matches.' : 'No documents yet.' + (admin ? ' Press "+ Add document" to add the first one.' : ' An admin adds them.')}</p>`;
      list.querySelectorAll('.doc-card').forEach((el) => {
        const id = el.dataset.id;
        const doc = docs.concat(d.team || []).find((x) => String(x.id) === id);
        el.querySelector('.doc-open').onclick = () => open(id);
        const info = el.querySelector('.doc-info');
        info.onclick = () => { const p = el.querySelector('.doc-purpose'); p.hidden = !p.hidden; info.setAttribute('aria-expanded', String(!p.hidden)); };
        const more = el.querySelector('.doc-more');
        if (more) {
          more.onclick = () => { const a = el.querySelector('.doc-actions'); a.hidden = !a.hidden; };
          el.querySelector('.doc-edit').onclick = () => { docState.editing = doc; editor(doc); };
          el.querySelector('.doc-move').onchange = async (e) => {
            const to = e.target.value;
            const r = await window.statusApp.saveDocument(Object.assign({}, doc, { category: to })).catch((err) => ({ ok: false, error: err.message }));
            if (!r || !r.ok) return msg(friendlyBackendError(r && r.error, 'Couldn\'t move it.'), true);
            showDocuments({ text: `"${doc.title}" moved to ${to}.`, fresh: true });
          };
          el.querySelector('.doc-del').onclick = async () => {
            if (!window.confirm(`Remove "${doc.title}" from the Document Centre? The file itself isn't touched.`)) return;
            const r = await window.statusApp.deleteDocument(id).catch((err) => ({ ok: false, error: err.message }));

  // -------------------- Ticket board (1.5) --------------------

  const TB_CLOSED_RE = /^(resolved|closed|done|completed|complete|cancel+ed|fixed|won't fix|wont fix)$/i; // as Code.gs CLOSED_TICKET_RE_
  const TB_STUCK_RE = /(pending|in[ -]?progress|working|waiting|on[ -]?hold)/i;

  // A ticket on Home's "Waiting more than a week" → its update screen

  const tbCache = {};
  function tbTitleOf(t) { return stripMarkdown(t.Issue || t.Subject || t.Title || t.Summary || t.Description || '') || '(no description)'; }
  function tbOwnerOf(t) { return String(t.Owner || t['Assigned To'] || t.Assignee || '').trim(); }

  function tbStatuses(tab, tickets) {

      if (spec && spec.optionsKey) opts = resolveOptions(spec.optionsKey, liveOptions) || [];
    } catch (e) { opts = []; }
    const seen = opts.slice();
    tickets.forEach((t) => { const st = String(t.Status || '').trim(); if (st && !seen.some((x) => x.toLowerCase() === st.toLowerCase())) seen.push(st); });
    if (!opts.length) seen.sort((a, b) => { const ia = TB_ORDER.indexOf(a.toLowerCase()), ib = TB_ORDER.indexOf(b.toLowerCase()); return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib); });

  async function showTicketBoard(tab, opts) {

  function renderTicketBoard(tab, tickets) {

    els.main.appendChild(bar);

    bar.querySelectorAll('.tb-chip').forEach((b) => {
      b.onclick = () => {

        else if (b.dataset.f === 'mine') Object.assign(tbState, { mine: !tbState.mine, who: '' });
        else if (b.dataset.f === 'stuck') tbState.stuck = !tbState.stuck;
        else if (b.dataset.who) Object.assign(tbState, { who: tbState.who === b.dataset.who ? '' : b.dataset.who, mine: false });

    bar.querySelector('#tb-find').oninput = (e) => { tbState.q = e.target.value; renderTicketColumns(tab, tickets); };
    const board = document.createElement('div');
    board.className = 'tb-board';
    board.id = 'tb-board';

  function renderTicketColumns(tab, tickets) {
    const board = document.getElementById('tb-board');
    if (!board) return;
    const statuses = JSON.parse(board.dataset.statuses || '[]');
    const words = tbState.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const me = String(tbState.me || '').toLowerCase();
    const shown = tickets.filter((t) => {
      const owner = tbOwnerOf(t).toLowerCase();
      if (tbState.mine && owner !== me && String(t.Requester || '').toLowerCase() !== me) return false;
      if (tbState.who && owner !== tbState.who.toLowerCase()) return false;
      if (tbState.stuck && !(TB_STUCK_RE.test(String(t.Status || '')) && (tbDays(t) || 0) > 7)) return false;
      if (words.length) {
        const hay = [t['Ticket ID'], tbTitleOf(t), t.Requester, tbOwnerOf(t), t.Comments, t.Group].filter(Boolean).join(' ').toLowerCase();
        if (!words.every((w) => hay.includes(w))) return false;
      }
      return true;
    });
    board.innerHTML = '';
    statuses.forEach((st, ci) => {
      const closed = TB_CLOSED_RE.test(st);
      const list = shown.filter((t) => String(t.Status || '').trim().toLowerCase() === st.toLowerCase());
      const col = document.createElement('div');
      col.className = 'tb-col';
      col.dataset.status = st;
      const cap = closed && !tbState.open[st] ? 6 : Infinity;
      col.innerHTML = `<div class="tb-ch"><span class="dot" style="background:${TB_DOTS[ci % TB_DOTS.length]}"></span>${escapeHtml(st)}<span class="n">${list.length}</span>${closed && list.length > cap ? '<span class="sub">newest first</span>' : ''}</div>`;
      list.slice(0, cap).forEach((t) => col.appendChild(tbCard(tab, t, statuses)));
      if (list.length > cap) {
        const more = document.createElement('button');
        more.type = 'button';
        more.className = 'tb-more';
        more.textContent = `+ ${list.length - cap} more`;

      col.addEventListener('dragleave', (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove('drop'); });
      col.addEventListener('drop', (e) => {

        if (t) tbMove(tab, t, st);
      });
      board.appendChild(col);
    });

  function tbCard(tab, t, statuses) {
    const st = String(t.Status || '').trim();
    const days = tbDays(t);
    const stuck = TB_STUCK_RE.test(st) && days != null && days > 7;
    const crit = stuck && days >= 14;
    const owner = tbOwnerOf(t);
    const pri = String(t.Priority || '').trim();

      : stuck ? `<span class="tb-age ${crit ? 'crit' : 'warn'}">${crit ? '⏱' : '⏳'} ${days} days</span>`
      : days != null ? `<span class="tb-days">${days === 0 ? 'opened today' : days === 1 ? 'opened yesterday' : `opened ${days} days ago`}</span>` : '';
    c.innerHTML = `<div class="tb-r1"><span class="tb-id">${escapeHtml(t['Ticket ID'])}</span>${pri ? `<span class="tb-pri ${escapeHtml(pri.toLowerCase())}">${/high|urgent/i.test(pri) ? '▲ ' : /low/i.test(pri) ? '▽ ' : '◆ '}${escapeHtml(pri)}</span>` : ''}</div>
      <div class="tb-ttl">${escapeHtml(tbTitleOf(t))}</div>
      ${t.Requester || t.Group ? `<div class="tb-from">${t.Requester ? 'From ' + escapeHtml(t.Requester) : ''}${t.Requester && t.Group ? ' · ' : ''}${escapeHtml(t.Group || '')}</div>` : ''}
      <div class="tb-r3">${owner ? `<span class="tb-own"><span class="a">${escapeHtml(owner[0].toUpperCase())}</span>${escapeHtml(owner)}</span>` : '<span class="tb-own none">Nobody yet</span>'}${badge}</div>`;
    c.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', String(t['Ticket ID'])); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); });
    c.addEventListener('dragend', () => c.classList.remove('dragging'));
    c.addEventListener('click', () => showWeeklyConnectEdit(t, true));

    return c;

  async function tbMove(tab, t, status, refocus) {

    const r = await window.statusApp.updateWeeklyConnectTicket(t['Ticket ID'], status, t.Comments || '', tab).catch((e) => ({ ok: false, error: e.message }));
    if (!r || r.ok === false) {

  // -------------------- Leave calendar (1.5) --------------------

  // -------------------- Team directory (1.5.1) --------------------
  // A field whose choices come from the directory has an OptionsKey of
  // "@dir:<group>|<group>" ("@dir:*" = everyone). The lists arrive with the
  // typed ones (liveOptions), worked out by the team's Sheet.
  const DIR_KEY = '@dir:';
  const isDirKey = (k) => String(k || '').indexOf(DIR_KEY) === 0;
  const nameKey = (v) => String(v == null ? '' : v).toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
  function editDistance(a, b, cap) {
    if (Math.abs(a.length - b.length) > cap) return cap + 1;
    let prev = Array.from({ length: b.length + 1 }, (x, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      let best = i;
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        if (cur[j] < best) best = cur[j];
      }
      if (best > cap) return cap + 1;
      prev = cur;
    }
    return prev[b.length];
  }
  // "Did you mean…?" — names a typed one is probably a typo of.
  function closeNames(typed, names) {
    const k = nameKey(typed);
    if (k.length < 3) return [];
    const cap = k.length <= 5 ? 1 : 2;
    return names
      .map((n) => ({ n, d: editDistance(k, nameKey(n), cap) }))
      .filter((x) => x.d > 0 && x.d <= cap)
      .sort((a, b) => a.d - b.d)
      .slice(0, 3)
      .map((x) => x.n);
  }

      if (q && !exact) rows.push({ n: q, kind: 'other' });
      list.innerHTML = rows.length ? rows.map((r, i) => `<div class="pp-opt ${r.kind}" role="option" id="${listId}-${i}" data-i="${i}">${r.kind === 'dym' ? `Did you mean <b>${escapeHtml(r.n)}</b>?` : r.kind === 'other' ? `Other: use “${escapeHtml(r.n)}” <span class="pp-note">(not in the team directory)</span>` : escapeHtml(r.n)}</div>`).join('')
        : `<div class="pp-empty">${names.length ? 'Everyone on the list is picked.' : 'No names here yet — type one. An admin adds people in People → Team directory.'}</div>`;
      list.querySelectorAll('.pp-opt').forEach((o) => {
        o.addEventListener('mousedown', (e) => e.preventDefault());
        o.onclick = () => pick(rows[Number(o.dataset.i)].n);
      });
      list.hidden = false;
      input.setAttribute('aria-expanded', 'true');
      setActive(rows.findIndex((r) => r.kind !== 'other') === -1 ? 0 : rows.findIndex((r) => r.kind === 'dym' || r.kind === 'name'));
    };
    input.addEventListener('focus', open);
    input.addEventListener('input', (e) => { e.stopPropagation(); open(); });
    input.addEventListener('blur', () => setTimeout(close, 120));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (list.hidden) open(); else setActive(active + (e.key === 'ArrowDown' ? 1 : -1)); }
      else if (e.key === 'Enter') { if (!list.hidden && rows[active]) { e.preventDefault(); pick(rows[active].n); } else if (input.value.trim()) { e.preventDefault(); open(); } }
      else if (e.key === 'Escape') { if (!list.hidden) { e.stopPropagation(); close(); } }
      else if (e.key === 'Backspace' && !input.value && chosen.length && multiple) { chosen.pop(); drawChips(); changed(); }
    });
    drawChips();
    Object.defineProperty(wrap, 'value', { get: () => chosen.join(', ') });
    return wrap;
  }
  // Pick groups: the team's groups as chips (click to add or take off), and
  // a box to start a new one.
  function groupPicker(groups, selected) {
    const sel = new Set((selected || []).map((g) => g.toLowerCase()));
    const all = (groups || []).filter((g) => g.status === 'Active' || sel.has(g.name.toLowerCase())).map((g) => g.name);
    (selected || []).forEach((g) => { if (!all.some((x) => x.toLowerCase() === g.toLowerCase())) all.push(g); });
    const wrap = document.createElement('div');
    wrap.className = 'grp-pick';
    const draw = () => {
      wrap.innerHTML = all.map((g) => `<button type="button" class="chip${sel.has(g.toLowerCase()) ? ' selected' : ''}" data-g="${escapeHtml(g)}" aria-pressed="${sel.has(g.toLowerCase())}">${escapeHtml(g)}</button>`).join('')
        + '<input type="text" class="grp-new" placeholder="+ New group" aria-label="New group name" maxlength="40" />';
      wrap.querySelectorAll('.chip').forEach((b) => {
        b.onclick = () => { const k = b.dataset.g.toLowerCase(); if (sel.has(k)) sel.delete(k); else sel.add(k); draw(); };
      });
      const nw = wrap.querySelector('.grp-new');
      const add = (refocus) => {
        const v = nw.value.replace(/[,|;]+/g, ' ').replace(/\s+/g, ' ').trim();
        nw.value = '';
        if (!v || !nw.isConnected) return;
        if (!all.some((x) => x.toLowerCase() === v.toLowerCase())) all.push(v);
        sel.add(v.toLowerCase());
        // Redraw after this event is done (never while the box is losing focus).
        setTimeout(() => { draw(); if (refocus) wrap.querySelector('.grp-new').focus(); }, 0);
      };
      nw.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); add(true); } });
      nw.addEventListener('blur', () => add(false));
    };
    draw();
    Object.defineProperty(wrap, 'value', { get: () => all.filter((g) => sel.has(g.toLowerCase())) });
    return wrap;
  }

  function buildFieldInput(tab, col, presetValue) {
    let spec = (typeof fieldSpecFor === 'function' && fieldSpecFor(tab, col, liveFieldSchema)) || null;
    // A column called "Date" (or "… Date") with no type set still gets a
    // calendar — unless what's already in it isn't a plain date, then it
    // stays a text box so nothing typed another way is ever lost.
    if (!spec && looksLikeDateColumn(col) && (!presetValue || isIsoDate(presetValue))) spec = { type: 'date', inferred: true };

    // Names from the team directory (1.5.1): pick from the list, or "Other…".
    if (spec && (spec.type === 'select' || spec.type === 'multiselect') && isDirKey(spec.optionsKey)) {
      return buildPeoplePicker(spec, presetValue);
    }

    if (spec && spec.type === 'select') {
      const select = document.createElement('select');
      const blank = document.createElement('option');
      blank.value = ''; blank.textContent = '— choose —';
      select.appendChild(blank);
      const choices = resolveOptions(spec.optionsKey, liveOptions);
      choices.forEach((opt) => {
        const o = document.createElement('option');
        o.value = opt; o.textContent = opt;
        select.appendChild(o);
      });
      // A value that's no longer a choice stays on the entry when it's edited.
      if (presetValue && !choices.includes(presetValue)) select.appendChild(new Option(presetValue, presetValue));
      if (presetValue) select.value = presetValue;
      return select;
    }

    if (spec && spec.type === 'multiselect') {
      const group = document.createElement('div');
      group.className = 'chip-group';
      const preselected = presetValue
        ? presetValue.split(',').map((s) => s.trim()).filter(Boolean)
        : [];
      const selected = new Set(preselected);
      const choices = resolveOptions(spec.optionsKey, liveOptions);
      // Values that are no longer choices stay on the entry (shown, already picked).
      choices.concat(preselected.filter((v) => !choices.includes(v))).forEach((opt) => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.textContent = opt;
        if (selected.has(opt)) chip.classList.add('selected');
        chip.onclick = () => {
          if (selected.has(opt)) { selected.delete(opt); chip.classList.remove('selected'); }
          else { selected.add(opt); chip.classList.add('selected'); }
        };
        group.appendChild(chip);
      });
      // Give the group a value-like interface so submit collection works uniformly.
      Object.defineProperty(group, 'value', {
        get: () => Array.from(selected).join(', '),
      });
      return group;
    }

    if (spec && spec.type === 'richtext') {
      // Stores lightweight Markdown (**bold**, - bullets, 1. numbered,
      // [text](url)), not HTML — HTML would render as literal angle-
      // bracket noise when read directly in the Sheet cell (the whole
      // point of this app), and risks injection wherever the value gets
      // shown elsewhere (Teams, a future report). Markdown stays readable
      // as plain text even unrendered.
      const wrap = document.createElement('div');
      wrap.className = 'richtext-wrap';

      const toolbar = document.createElement('div');
      toolbar.className = 'richtext-toolbar';

      const textarea = document.createElement('textarea');
      textarea.rows = 4;
      if (presetValue) textarea.value = presetValue;

      const wrapSelection = (before, after) => {
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const selected = textarea.value.slice(start, end);
        textarea.focus();
        textarea.setRangeText(before + selected + after, start, end, 'end');
      };
      const prefixLines = (makeLine) => {
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const value = textarea.value;
        const lineStart = value.lastIndexOf('\n', start - 1) + 1;
        const nextBreak = value.indexOf('\n', end);
        const lineEnd = nextBreak === -1 ? value.length : nextBreak;
        const block = value.slice(lineStart, lineEnd);
        const newBlock = block.split('\n').map(makeLine).join('\n');
        textarea.focus();
        textarea.setRangeText(newBlock, lineStart, lineEnd, 'end');
      };

      const makeToolbarBtn = (label, title, onClick) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'richtext-btn';
        btn.textContent = label;
        btn.title = title;
        btn.onclick = (e) => { e.preventDefault(); onClick(); };
        return btn;
      };
      toolbar.appendChild(makeToolbarBtn('B', 'Bold', () => wrapSelection('**', '**')));
      toolbar.appendChild(makeToolbarBtn('•', 'Bullet list', () =>
        prefixLines((line) => (line.startsWith('- ') ? line : '- ' + line))
      ));
      toolbar.appendChild(makeToolbarBtn('1.', 'Numbered list', () =>
        prefixLines((line, i) => (i + 1) + '. ' + line.replace(/^\d+\.\s*/, ''))
      ));
      toolbar.appendChild(makeToolbarBtn('🔗', 'Insert link', () => {
        const url = window.prompt('Link URL:');
        if (!url) return;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const label = textarea.value.slice(start, end) || 'link';
        textarea.focus();
        textarea.setRangeText('[' + label + '](' + url + ')', start, end, 'end');
      }));

      const preview = document.createElement('div');
      preview.className = 'richtext-preview';
      const syncPreview = () => {
        preview.innerHTML = textarea.value.trim()
          ? renderMarkdownLite(textarea.value)
          : '<span class="richtext-preview-empty">Preview appears here as you type…</span>';
      };
      textarea.addEventListener('input', syncPreview);
      syncPreview();

      wrap.appendChild(toolbar);
      wrap.appendChild(textarea);
      wrap.appendChild(preview);
      // Give the wrapper a value-like interface so submit/draft-save
      // collection works uniformly — same trick the multiselect chip-group
      // above uses, since this isn't a real form control itself.
      Object.defineProperty(wrap, 'value', {
        get: () => textarea.value,
      });
      return wrap;
    }

    if (spec && (spec.type === 'url' || spec.type === 'attachment')) {
      // Same field for both — "attachment" here means "one or more
      // SharePoint document links" rather than an actual file upload (this
      // app writes plain cell values to the Sheet, not binary files), so
      // it only differs from "url" in the placeholder/button text below.
      // Multiple links are stored newline-separated in the one cell —
      // chosen over comma-separated (what multiselect uses) since a URL's
      // own query string can legitimately contain a comma.
      const isAttachment = spec.type === 'attachment';
      const wrap = document.createElement('div');
      wrap.className = 'url-list-wrap';
      const rowsWrap = document.createElement('div');
      wrap.appendChild(rowsWrap);

      const addRow = (value) => {
        const row = document.createElement('div');
        row.className = 'url-list-row';
        const input = document.createElement('input');
        input.type = 'url';
        input.placeholder = isAttachment ? 'Paste a SharePoint document link' : 'https://…';
        input.value = value || '';
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'url-remove-btn';
        del.textContent = '✕';
        del.title = 'Remove this link';
        del.onclick = () => row.remove();
        row.appendChild(input);
        row.appendChild(del);
        rowsWrap.appendChild(row);
      };

      const existing = presetValue
        ? presetValue.split('\n').map((s) => s.trim()).filter(Boolean)
        : [];
      if (existing.length) existing.forEach(addRow);
      else addRow('');

      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'url-add-btn';
      addBtn.textContent = isAttachment ? '+ Add another document' : '+ Add another link';
      addBtn.onclick = () => addRow('');
      wrap.appendChild(addBtn);

      // Give the wrapper a value-like interface so submit/draft-save
      // collection works uniformly — same trick multiselect/richtext/
      // checkbox above use, since this isn't a real form control itself.
      // The 'input' listener submit/draft-save attach to this element
      // still fires: native input events bubble up from the nested
      // <input>s to this wrapper.
      Object.defineProperty(wrap, 'value', {
        get: () =>
          Array.from(rowsWrap.querySelectorAll('input'))
            .map((i) => i.value.trim())
            .filter(Boolean)
            .join('\n'),
      });
      return wrap;
    }

    if (spec && spec.type === 'date' && (!presetValue || isIsoDate(presetValue))) {
      const input = document.createElement('input');
      input.type = 'date';
      if (presetValue) input.value = String(presetValue).trim().slice(0, 10);
      return input;
    }

    if (spec && spec.type === 'checkbox') {
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = presetValue === 'Yes';
      // Real checkboxes report .value as the fixed string "on" regardless
      // of checked state — override it so submit/draft-save (both just
      // read el.value) get a plain "Yes"/"" like every other field type,
      // same trick the multiselect chip-group uses below.
      Object.defineProperty(input, 'value', {
        get: () => (input.checked ? 'Yes' : ''),
      });
      return input;
    }

    if (spec && spec.type === 'week-auto') {
      const input = document.createElement('input');
      input.type = 'text';
      input.readOnly = true;
      input.placeholder = 'Auto-filled from Date';
      return input;
    }

    if (spec && spec.type === 'sequence') {
      const input = document.createElement('input');
      input.type = 'text';
      input.readOnly = true;
      input.placeholder = 'Loading…';
      return input;
    }

    const isLong = /notes|description|blocker|comment|detail/i.test(col);
    const input = document.createElement(isLong ? 'textarea' : 'input');
    if (isLong) input.rows = 2;
    if (presetValue) input.value = presetValue;
    else if (/name/i.test(col) && yourName) input.value = yourName;
    return input;
  }

  // Daily status: when someone leaves the Ticket ID field with an ID that's
  // already logged on this tab, say where (date, who) right under the
  // field. Only a heads-up — the same ticket can be worked on for days.
  const isDailyStatusTab = (tab) => liveTabTypes[tab] === 'daily-status' || (!liveTabTypes[tab] && /daily\s*status/i.test(tab));
  function warnDuplicateTicket(tab, inputs, editingRowIndex) {
    if (!isDailyStatusTab(tab)) return;
    const col = Object.keys(inputs).find((k) => /^ticket\s*(id|no\.?|number|#)?$/i.test(k.trim()));
    const input = col && inputs[col];
    if (!input || input.readOnly) return;
    const note = document.createElement('div');
    note.className = 'dup-warning';
    note.setAttribute('role', 'status');
    note.hidden = true;
    (input.closest('.field') || input.parentElement).appendChild(note);
    let rowsPromise = null;
    const check = async () => {
      const id = String(input.value || '').trim();
      note.hidden = true;
      if (!id) return;
      rowsPromise = rowsPromise || window.statusApp.getTabRows(tab).then((r) => (r && r.rows) || []).catch(() => []);
      const rows = await rowsPromise;
      if (String(input.value || '').trim() !== id) return; // changed while we looked
      const hits = rows.filter((r) => r.rowIndex !== editingRowIndex && String((r.values || {})[col] == null ? '' : r.values[col]).trim().toLowerCase() === id.toLowerCase());
      if (!hits.length) return;
      const last = hits[hits.length - 1].values || {};
      const when = last.Date ? String(last.Date).slice(0, 10) : '';
      const who = last.Name || last.Requester || '';
      const more = hits.length > 1 ? ` — logged ${hits.length} times so far` : '';
      note.textContent = `⚠ ${id} is already in ${tab}${when || who ? ` (${[when, who].filter(Boolean).join(', ')})` : ''}${more}. You can still save it if this is another update on the same ticket.`;
      note.hidden = false;
    };
    input.addEventListener('change', check);
    input.addEventListener('blur', check);
    input.addEventListener('input', () => { note.hidden = true; });
  }

  async function showForm(tab) {
    const scr = beginScreen(); // a newer screen takes over: this one stops drawing
    setScreen(tab, tabHomeIsList(tab) ? tabTrail().concat([{ label: tab, go: () => showTabEntries(tab) }]) : tabTrail());
    showLoading('Loading fields…');
    try {
      const [{ columns: rawColumns }, la] = await Promise.all([window.statusApp.getColumns(tab), leaveApprovalFor(tab), freshDirOptions(tab)]);
      if (scr.stale) return;
      const columns = leaveColumns(rawColumns, la);
      els.main.innerHTML = '';
      const inputs = {};
      const draft = loadDraft(tab);
      let formHost = els.main;
      let pane = null;
      if (splitEligible(tab)) {
        const layout = makeSplitLayout();
        formHost = layout.left;
        pane = createSheetPane(layout.paneEl, tab, { mode: 'new', columns });
      }

      if (isTicketTab(tab)) {
        currentTicketTab = tab;
        formHost.appendChild(tileGrid([
          makeTile({ id: 'wc-view-tickets', icon: '🎫', title: 'View & update tickets', hint: 'Status, priority, filters and Teams posting', onClick: () => showWeeklyConnectTickets() }),
          makeTile({ id: 'wc-board-tile', icon: '🗂', title: 'Ticket board', hint: 'A column per status — drag a ticket to move it', onClick: () => showTicketBoard(tab) }),
        ], true));
      }

      columns.forEach((col) => {
        const lc = col.trim().toLowerCase();
        if (la && LEAVE_SYS_COLS.includes(lc)) return; // the approver fills these in
        const wrap = document.createElement('div');
        wrap.className = 'field';
        const label = document.createElement('label');
        label.textContent = col;
        const input = la && lc === 'approver' ? approverSelect(la, draft[col], true) : buildFieldInput(tab, col, draft[col]);
        wrap.appendChild(label);
        wrap.appendChild(input);
        formHost.appendChild(wrap);
        inputs[col] = input;
      });
      if (la) {
        const note = document.createElement('div');
        note.className = 'inline-msg leave-ap-msg';
        note.id = 'leave-ap-msg';
