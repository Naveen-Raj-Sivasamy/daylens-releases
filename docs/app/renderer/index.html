    showLoading('Loading leave requests…');
    const r = await window.statusApp.getLeaveRequests().catch((e) => ({ ok: false, error: e.message }));
    if (scr.stale) return;
    if (!r || !r.ok) { showError(friendlyBackendError(r && r.error, 'Could not load the leave requests.'), () => showApprovals()); return; }
    if (!r.on) {
      els.main.innerHTML = '<p class="login-hint" id="approvals-off">Leave approval is switched off. An admin switches it on in Tabs &amp; fields → App Settings, and marks approvers in People.</p>';
      return;
    }
    const waiting = groupLeave(r.toDecide || []);
    const decided = groupLeave(r.decided || []);
    const mine = groupLeave(r.mine || []);
    els.main.innerHTML = `
      <p class="login-hint">Leave requests waiting for your OK. Approved leave shows on the dashboard and counts in the Friday check-in; the person gets a pop-up either way.</p>
      <div class="inline-msg ${message && message.err ? 'err' : 'ok'}" id="approvals-msg">${escapeHtml((message && message.text) || '')}</div>
      <div class="ap-section">Waiting for you${waiting.length ? ` (${waiting.length})` : ''}</div>
      <div id="ap-waiting">${waiting.length ? '' : '<p class="card-sub" id="ap-none">Nothing waiting. 🎉</p>'}</div>
      ${decided.length ? '<div class="ap-section">You decided recently</div><div id="ap-decided"></div>' : ''}
      ${mine.length ? '<div class="ap-section">Your own leave requests</div><div id="ap-mine"></div>' : ''}`;
    const msg = (text, err) => { const m = document.getElementById('approvals-msg'); m.className = 'inline-msg ' + (err ? 'err' : 'ok'); m.textContent = text; };
    const host = document.getElementById('ap-waiting');
    waiting.forEach((g) => {
      const card = document.createElement('div');
      card.className = 'card ap-card';
      card.dataset.who = g.who;
      const days = g.dates.length;
      card.innerHTML = `
        <div class="card-row">
          <span class="avatar-sm">${escapeHtml(g.who.slice(0, 2).toUpperCase())}</span>
          <div class="grow">
            <div class="card-title">${escapeHtml(g.who)} · ${escapeHtml(leaveRunText(g.dates))}</div>
            <div class="card-sub">${[g.type, days > 1 ? days + ' days' : '', g.reason].filter(Boolean).map(escapeHtml).join(' · ')}${g.approver ? '' : ' · <i>asked any approver</i>'}</div>
          </div>
          ${stChip('Pending')}
        </div>
        <div class="card-row ap-actions">
          <input type="text" class="grow ap-note" maxlength="300" placeholder="Note to ${escapeHtml(g.who)} (optional)" aria-label="Note to ${escapeHtml(g.who)}" />
          <button type="button" class="mini-btn go ap-approve">Approve</button>
          <button type="button" class="mini-btn danger ap-reject">Reject</button>
        </div>`;
      const decide = async (decision) => {
        const btns = card.querySelectorAll('button');
        btns.forEach((b) => { b.disabled = true; });
        const note = card.querySelector('.ap-note').value.trim();
        const out = await window.statusApp.decideLeave({ items: g.items.map((it) => ({ tab: it.tab, rowIndex: it.rowIndex, expected: it.values })), decision, note })
          .catch((e) => ({ ok: false, error: e.message }));
        if (!out || !out.ok) { btns.forEach((b) => { b.disabled = false; }); msg(friendlyBackendError(out && out.error, 'That didn\'t work.'), true); return; }
        if (window.__appMode) window.__appPost({ type: 'approvals-changed' });
        showApprovals({ text: `${decision === 'Approved' ? 'Approved' : 'Not approved'}: ${g.who}, ${leaveRunText(g.dates)}. ${g.who} gets a pop-up.` });
      };
      card.querySelector('.ap-approve').onclick = () => decide('Approved');
      card.querySelector('.ap-reject').onclick = () => decide('Rejected');
      host.appendChild(card);
    });
    const line = (g, showWho) => {
      const d = document.createElement('div');
      d.className = 'card';
      const st = g.items[0].status;
      const note = String(g.items[0].values['Decision note'] || '').trim();
      d.innerHTML = `<div class="card-row"><div class="grow"><div class="card-title">${showWho ? escapeHtml(g.who) + ' · ' : ''}${escapeHtml(leaveRunText(g.dates))}${stChip(st)}</div>
        <div class="card-sub">${[g.type, g.approver && st !== 'Pending' ? 'by ' + g.approver : g.approver ? 'asked ' + g.approver : '', note ? '“' + note + '”' : ''].filter(Boolean).map(escapeHtml).join(' · ')}</div></div></div>`;
      return d;
    };
    const dHost = document.getElementById('ap-decided');
    if (dHost) decided.forEach((g) => dHost.appendChild(line(g, true)));
    const mHost = document.getElementById('ap-mine');
    if (mHost) mine.forEach((g) => mHost.appendChild(line(g, false)));
  }

  // A Leave form while leave approval is on: "Approver" is a drop-down of
  // the team's approvers (not yourself), and the decision columns are the
  // approver's to fill — hidden on a new request, shown read-only on an
  // existing one. Returns null when approval is off (or the Sheet is older).
  async function leaveApprovalFor(tab) {
    if (liveTabTypes[tab] !== 'leave') return null;
    const [r, me] = await Promise.all([
      window.statusApp.listApprovers().catch(() => null),
      window.statusApp.getSessionStatus().catch(() => ({})),
    ]);
    if (!r || !r.ok || !r.on) return null;
    const myName = String((me && me.username) || '');
    return { approvers: (r.approvers || []).filter((a) => a.toLowerCase() !== myName.toLowerCase()), me: myName };
  }
  function leaveColumns(columns, la) {
    if (!la) return columns;
    const out = columns.slice();
    ['Approver', 'Status', 'Decided on', 'Decision note'].forEach((c) => { if (!out.some((x) => x.trim().toLowerCase() === c.toLowerCase())) out.push(c); });
    return out;
  }
  function approverSelect(la, value, enabled) {
    const sel = document.createElement('select');
    sel.className = 'leave-approver';
    sel.appendChild(new Option(la.approvers.length ? '— choose who approves —' : 'No approver set up yet (an admin marks them in People)', ''));
    la.approvers.forEach((a) => sel.appendChild(new Option(a, a)));
    if (value && !la.approvers.some((a) => a === value)) sel.appendChild(new Option(value, value));
    if (value) sel.value = value;
    sel.disabled = !enabled;
    return sel;
  }

  async function showFeatures() {
    const scr = beginScreen(); // a newer screen takes over: this one stops drawing
    appSection('features');
    els.footer.classList.add('hidden');
    setScreen('Features', []);
    els.main.style.minHeight = '';
    const FX = window.DAYLENS_FEATURES;
    const [st, tabsRes] = await Promise.all([
      window.statusApp.getSessionStatus().catch(() => ({})),
      window.statusApp.getTabs().catch(() => null),
    ]);
    if (scr.stale) return;
    const admin = !!(st && st.loggedIn && st.role === 'Admin');
    const tabs = (tabsRes && tabsRes.tabs) || [];
    // "type:leave" → this team's first Leave tab (if it has one)
    const resolve = (go) => {
      if (!go) return null;
      const m = /^(type|board):(.+)$/.exec(go);
      if (!m) return go;
      const t = tabs.find((x) => liveTabTypes[x] === m[2] && (m[1] !== 'board' || liveDataSourceTypes[x] !== 'Excel'));
      return t ? (m[1] === 'board' ? 'board:' : 'tab:') + t : null;
    };
    els.main.innerHTML = `
      <p class="login-hint">Everything Daylens does, and how to use it. Search for something, or press "Take me there" to go straight to it.</p>
      <div class="field feat-search"><input type="search" id="features-search" placeholder="Search features, e.g. leave, reminder, report, theme" aria-label="Search features" autocomplete="off" /></div>
      <div class="card-sub" id="features-count" aria-live="polite"></div>
      <div id="features-list"></div>`;
    const input = document.getElementById('features-search');
    input.value = featuresQuery;
    const list = document.getElementById('features-list');
    const draw = () => {
      featuresQuery = input.value;
      const words = featuresQuery.toLowerCase().split(/\s+/).filter(Boolean);
      const hit = (f) => {
        const text = [f.title, f.what, f.how.join(' '), f.keywords || '', f.area].join(' ').toLowerCase();
        return words.every((w) => text.includes(w));
      };
      const shown = FX.list.filter(hit);
      document.getElementById('features-count').textContent = words.length
        ? `${shown.length} of ${FX.list.length} features match.` : `${FX.list.length} features.`;
      list.innerHTML = '';
      if (!shown.length) {
        list.innerHTML = '<p class="entries-empty">Nothing matches that. Try another word, or ask Ask Daylens at the bottom right.</p>';
        return;
      }
      FX.areas.forEach((area) => {
        const inArea = shown.filter((f) => f.area === area);
        if (!inArea.length) return;
        const head = document.createElement('div');
        head.className = 'feat-area';
        head.textContent = area === 'Admin' ? (admin ? 'Admin' : 'Admin (view only for you)') : area;
        list.appendChild(head);
        inArea.forEach((f) => {
          const target = resolve(f.go);
          const card = document.createElement('div');
          card.className = 'card feat-card';
          card.dataset.feature = f.id;
          const tag = f.admin ? (admin ? '<span class="pill admin">Admins</span>' : '<span class="pill off">View only</span>') : '';
          const goBtn = f.go
            ? (target ? '<button type="button" class="mini-btn go feat-go">Take me there →</button>'
              : '<span class="card-sub feat-none">Your team has no such tab yet.</span>')
            : '';
          card.innerHTML = `
            <div class="card-row">
              <div class="grow"><div class="card-title">${escapeHtml(f.title)} ${tag}</div><div class="card-sub feat-what">${escapeHtml(f.what)}</div></div>
              ${goBtn}
            </div>
            <details class="feat-how" ${words.length ? 'open' : ''}><summary>How to use it</summary><ol>${f.how.map((h) => `<li>${escapeHtml(h)}</li>`).join('')}</ol></details>`;
          const b = card.querySelector('.feat-go');
          if (b) b.onclick = () => window.__appMode && window.__appPost({ type: 'go', target });
          list.appendChild(card);
        });
      });
    };
    input.oninput = draw;
    draw();
    input.focus();
  }

      card.querySelector('.reset-btn').onclick = () => {
        const row = card.querySelector('.reset-row');
        row.hidden = !row.hidden;
        if (!row.hidden) { card.querySelector('.reset-input').value = randomTempPassword(); card.querySelector('.reset-input').focus(); }
      };
      card.querySelector('.reset-save').onclick = async () => {
        const p = card.querySelector('.reset-input').value;
        if (!p || p.length < 8) return msg('Use at least 8 characters for the temporary password.', true);
        const out = await window.statusApp.resetUserPassword(u.username, p).catch((err) => ({ ok: false, error: err.message }));
        if (!out || !out.ok) return msg((out && out.error) || 'Could not reset the password.', true);
        showUsers({ text: `Temporary password set for ${u.username}.`, invite: { username: u.username, password: p } });
      };
      card.querySelector('.delete-btn').onclick = async () => {
        if (!window.confirm(`Delete the account "${u.username}"? They won't be able to log in, and this can't be undone.`)) return;
        const out = await window.statusApp.deleteUser(u.username).catch((err) => ({ ok: false, error: err.message }));
        if (!out || !out.ok) return msg(friendlyBackendError(out && out.error, 'Could not delete the account.'), true);
        showUsers({ text: `Account "${u.username}" deleted.` });
      };
      list.appendChild(card);
    });
    const back = document.createElement('button');
    back.type = 'button'; back.className = 'secondary'; back.textContent = '← Settings';
    back.onclick = showSettings;
    els.main.appendChild(back);
  }

  // A backend that hasn't had the 2.0 Code.gs additions deployed yet
  // doesn't know the new actions — say that plainly instead of a cryptic
  // "Missing tab" style error.
  function friendlyBackendError(err, fallback) {
    const e = String(err || '');
    if (/missing "tab"|unknown action|unknown tab/i.test(e)) return 'This needs the updated Apps Script backend (Code.gs for app 2.0). Ask an admin to deploy it.';
    return e || fallback;
  }

  // -------------------- Reminders --------------------
  // Shared reminders, stored in the Sheet (_Reminders). Each can be for
  // one or more people; the app pops a desktop notification for them when
  // it's due (main.js polls every minute). Done is shared; Snooze is just
  // for you on this computer.
  const REMINDER_TYPES = [
    { id: 'Ticket', icon: '🎫', ref: 'Ticket number', ph: 'e.g. INC0012345' },
    { id: 'Mail', icon: '✉️', ref: 'Mail subject', ph: 'e.g. Re: Homepage banner approval' },
    { id: 'Request', icon: '📨', ref: 'Request', ph: 'e.g. Add new physician page' },
  ];
  let reminderFilter = 'open'; // open | done | all

  function fmtWhen(d) {
    return d.toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }
  function dueInfo(r) {
    const due = Math.max(Date.parse(r.dueAt) || 0, r.snoozedUntil ? Date.parse(r.snoozedUntil) || 0 : 0);
    const d = new Date(due);
    if (r.status === 'Done') return { cls: 'done', text: 'Done' + (r.doneBy ? ' by ' + r.doneBy : '') };
    const mins = Math.round((due - Date.now()) / 60000);
    if (mins <= 0) return { cls: 'overdue', text: (mins > -2 ? 'Due now' : 'Overdue') + ' · ' + fmtWhen(d) };
    if (mins < 120) return { cls: 'soon', text: `Due in ${mins} min · ${fmtWhen(d)}` };
    return { cls: 'later', text: 'Due ' + fmtWhen(d) };
  }

  async function showReminders(message) {
    const scr = beginScreen(); // a newer screen takes over: this one stops drawing
    appSection('reminders');
    els.footer.classList.add('hidden');
    setScreen('Reminders', []);
    showLoading('Loading reminders…');
    const [res, me] = await Promise.all([
      window.statusApp.listReminders().catch((err) => ({ ok: false, error: err.message })),
      window.statusApp.getSessionStatus().catch(() => ({})),
    ]);
    if (scr.stale) return;
    if (!res || !res.ok) {
      showError(friendlyBackendError(res && res.error, 'Could not load reminders.'), () => showReminders());
      return;
    }
    const myName = String(me.username || '').toLowerCase();
    const isAdmin = me.role === 'Admin';
    const all = res.reminders || [];
    const shown = all
      .filter((r) => reminderFilter === 'all' || (reminderFilter === 'done' ? r.status === 'Done' : r.status !== 'Done'))
      .sort((a, b) => (Date.parse(a.dueAt) || 0) - (Date.parse(b.dueAt) || 0));

    els.main.innerHTML = `
      <div class="inline-msg ok" id="rem-msg">${escapeHtml((message && message.text) || '')}</div>
      <div id="rem-new-host"></div>
      <div class="wc-filter-row" id="rem-filters">
        <button type="button" class="wc-filter-btn" data-f="open">Open (${all.filter((r) => r.status !== 'Done').length})</button>
        <button type="button" class="wc-filter-btn" data-f="done">Done</button>
        <button type="button" class="wc-filter-btn" data-f="all">All</button>
      </div>
      <div id="rem-list" class="scroll-list"></div>`;
    const remMsg = (t, err) => { const m = document.getElementById('rem-msg'); m.className = 'inline-msg ' + (err ? 'err' : 'ok'); m.textContent = t; };
    document.getElementById('rem-new-host').appendChild(tileGrid([
      makeTile({ id: 'new-reminder-tile', icon: '＋', title: 'New reminder', hint: 'Ticket, mail or request — remind yourself or teammates', variant: 'add', onClick: () => showReminderForm() }),
    ], true));
    document.querySelectorAll('#rem-filters .wc-filter-btn').forEach((b) => {
      b.classList.toggle('active', b.dataset.f === reminderFilter);
      b.onclick = () => { reminderFilter = b.dataset.f; showReminders(); };
    });
    const list = document.getElementById('rem-list');
    if (!shown.length) {
      list.innerHTML = `<div class="entries-empty">${reminderFilter === 'done' ? 'Nothing completed yet.' : 'No reminders here — add one above.'}</div>`;
    }
    shown.forEach((r) => {
      const type = REMINDER_TYPES.find((t) => t.id === r.type) || REMINDER_TYPES[0];
      const di = dueInfo(r);
      const mine = (r.assignedTo || []).some((a) => String(a).toLowerCase() === myName);
      const canDelete = isAdmin || String(r.createdBy).toLowerCase() === myName;
      const card = document.createElement('div');
      card.className = 'card reminder-card';
      card.dataset.id = r.id;
      card.innerHTML = `
        <div class="card-row" style="align-items:flex-start;">
          <span class="rem-type" aria-hidden="true">${type.icon}</span>
          <div class="grow">
            <div class="card-row" style="gap:8px;">
              <span class="card-title">${escapeHtml(r.reference)}</span>
              <span class="pill ${di.cls}">${escapeHtml(di.text)}</span>
            </div>
            <div class="card-sub">${escapeHtml(r.type)}${r.requester ? ' · from ' + escapeHtml(r.requester) : ''} · for ${escapeHtml((r.assignedTo || []).join(', ') || '—')} · added by ${escapeHtml(r.createdBy)}</div>
            ${r.comments ? `<div class="rem-comments">${escapeHtml(r.comments)}</div>` : ''}
          </div>
        </div>
        <div class="card-row" style="margin-top:10px; justify-content:flex-end;">
          ${r.status === 'Done'
            ? '<button type="button" class="mini-btn reopen-btn">Reopen</button>'
            : `<button type="button" class="mini-btn go done-btn">✓ Done</button>
               ${mine ? `<select class="snooze-sel" title="Snooze (just for you)">
                  <option value="">Snooze…</option><option value="15">15 minutes</option><option value="60">1 hour</option>
                  <option value="tomorrow">Tomorrow 9:00</option></select>` : ''}`}
          <button type="button" class="mini-btn edit-btn">Edit</button>
          ${canDelete ? '<button type="button" class="mini-btn danger delete-btn">Delete</button>' : ''}
        </div>`;
      const act = async (fn, okText) => {
        const out = await fn().catch((err) => ({ ok: false, error: err.message }));
        if (!out || out.ok === false) return remMsg(friendlyBackendError(out && out.error, 'That didn’t work — try again.'), true);
        showReminders({ text: okText });
      };
      const doneBtn = card.querySelector('.done-btn');
      if (doneBtn) doneBtn.onclick = () => act(() => window.statusApp.setReminderDone(r.id, true), `“${r.reference}” marked done.`);
      const reopen = card.querySelector('.reopen-btn');
      if (reopen) reopen.onclick = () => act(() => window.statusApp.setReminderDone(r.id, false), `“${r.reference}” reopened.`);
      const snooze = card.querySelector('.snooze-sel');
      if (snooze) snooze.onchange = () => {
        if (!snooze.value) return;
        let until;
        if (snooze.value === 'tomorrow') { until = new Date(); until.setDate(until.getDate() + 1); until.setHours(9, 0, 0, 0); }
        else until = new Date(Date.now() + Number(snooze.value) * 60000);
        act(() => window.statusApp.snoozeReminder(r.id, until.toISOString()), `Snoozed until ${fmtWhen(until)} (just for you).`);
      };
      card.querySelector('.edit-btn').onclick = () => showReminderForm(r);
      const del = card.querySelector('.delete-btn');
      if (del) del.onclick = () => {
        if (!window.confirm(`Delete the reminder “${r.reference}” for everyone on it?`)) return;
        act(() => window.statusApp.deleteReminder(r.id), 'Reminder deleted.');
      };
      list.appendChild(card);
    });
  }

  async function showReminderForm(existing) {
    const scr = beginScreen(); // a newer screen takes over: this one stops drawing
    appSection('reminders');
    els.footer.classList.add('hidden');
    setScreen(existing ? 'Edit reminder' : 'New reminder', [{ label: 'Reminders', go: () => showReminders() }]);

    ]);
    if (scr.stale) return;
    const people = (namesRes && namesRes.ok && namesRes.usernames) || [me.username].filter(Boolean);
    const r = existing || { type: 'Ticket', reference: '', requester: '', comments: '', dueAt: '', assignedTo: [me.username] };
    let type = r.type || 'Ticket';
    const assigned = new Set((r.assignedTo || []).map((x) => String(x)));
    const pad = (n) => String(n).padStart(2, '0');
    const toLocalInput = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const initialDue = r.dueAt ? new Date(r.dueAt) : new Date(Date.now() + 60 * 60000);

    els.main.innerHTML = `
      <div class="narrow" style="max-width:560px;">
        <div class="field"><label>Type</label>
          <div class="seg" id="rem-type-seg">${REMINDER_TYPES.map((t) => `<button type="button" data-t="${t.id}">${t.icon} ${t.id}</button>`).join('')}</div>
        </div>
        <div class="field"><label id="rem-ref-label">Ticket number</label><input id="rem-ref" /></div>
        <div class="field"><label>Requester</label><input id="rem-requester" placeholder="Who asked for it?" /></div>
        <div class="field"><label>Comments</label><textarea id="rem-comments" rows="3" placeholder="Anything you'll want to know when it pops up"></textarea></div>
        <div class="field"><label>Remind at</label>
          <input type="datetime-local" id="rem-due" />
          <div class="quick-due">
            <button type="button" class="mini-btn" data-q="60">In 1 hour</button>
            <button type="button" class="mini-btn" data-q="eod">Today 5:00 PM</button>
            <button type="button" class="mini-btn" data-q="tom">Tomorrow 9:00 AM</button>
            <button type="button" class="mini-btn" data-q="mon">Monday 9:00 AM</button>
          </div>
        </div>
        <div class="field"><label>Remind these people</label>
          <div class="chip-group assignee-chips" id="rem-people"></div>
        </div>
        <div class="inline-msg err" id="rem-form-err"></div>
        <div style="display:flex; gap:8px;">
          <button type="button" class="secondary" id="rem-cancel">Cancel</button>
          <button type="button" class="primary" id="rem-save">${existing ? 'Save changes' : 'Create reminder'}</button>
        </div>
      </div>`;
    const refInput = document.getElementById('rem-ref');
    const setType = (t) => {
      type = t;
      const def = REMINDER_TYPES.find((x) => x.id === t);
      document.querySelectorAll('#rem-type-seg button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
      document.getElementById('rem-ref-label').textContent = def.ref;
      refInput.placeholder = def.ph;
    };
    document.querySelectorAll('#rem-type-seg button').forEach((b) => (b.onclick = () => setType(b.dataset.t)));
    setType(type);
    refInput.value = r.reference || '';
    document.getElementById('rem-requester').value = r.requester || '';
    document.getElementById('rem-comments').value = r.comments || '';
    const dueInput = document.getElementById('rem-due');
    dueInput.value = toLocalInput(initialDue);
    document.querySelectorAll('.quick-due button').forEach((b) => (b.onclick = () => {
      const d = new Date();
      if (b.dataset.q === '60') d.setTime(Date.now() + 3600000);
      if (b.dataset.q === 'eod') d.setHours(17, 0, 0, 0);
      if (b.dataset.q === 'tom') { d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); }
      if (b.dataset.q === 'mon') { d.setDate(d.getDate() + (((8 - d.getDay()) % 7) || 7)); d.setHours(9, 0, 0, 0); }
      dueInput.value = toLocalInput(d);
    }));
    const peopleHost = document.getElementById('rem-people');
    const allPeople = Array.from(new Set(people.concat(Array.from(assigned))));
    allPeople.forEach((p) => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (assigned.has(p) ? ' selected' : '');
      chip.textContent = p + (String(p).toLowerCase() === String(me.username || '').toLowerCase() ? ' (me)' : '');
      chip.onclick = () => { if (assigned.has(p)) assigned.delete(p); else assigned.add(p); chip.classList.toggle('selected'); };
      peopleHost.appendChild(chip);
    });
    if (!(namesRes && namesRes.ok)) {
      document.getElementById('rem-form-err').textContent = friendlyBackendError(namesRes && namesRes.error, 'Could not load the people list.');
    }
    document.getElementById('rem-cancel').onclick = () => showReminders();
    document.getElementById('rem-save').onclick = async () => {
      const errEl = document.getElementById('rem-form-err');
      const reference = refInput.value.trim();
      const due = dueInput.value ? new Date(dueInput.value) : null;
      if (!reference) { errEl.textContent = `Add the ${REMINDER_TYPES.find((x) => x.id === type).ref.toLowerCase()}.`; return; }
      if (!due || isNaN(due)) { errEl.textContent = 'Pick when to be reminded.'; return; }
      if (!assigned.size) { errEl.textContent = 'Pick at least one person to remind.'; return; }
      const btn = document.getElementById('rem-save');
      btn.disabled = true;
      const out = await window.statusApp.saveReminder({
        id: existing ? existing.id : undefined,
        type, reference,
        requester: document.getElementById('rem-requester').value.trim(),
        comments: document.getElementById('rem-comments').value,
        dueAt: due.toISOString(),
        assignedTo: Array.from(assigned),
      }).catch((err) => ({ ok: false, error: err.message }));
      if (!out || out.ok === false) {
        btn.disabled = false;
        errEl.textContent = friendlyBackendError(out && out.error, 'Could not save the reminder.');
        return;
      }
      showReminders({ text: existing ? 'Reminder updated.' : `Reminder set for ${fmtWhen(due)} — ${Array.from(assigned).join(', ')} will get a pop-up then.` });
    };
    refInput.focus();
  }

        </div>` : ''}
        </div>
        <p class="login-hint" style="text-align:center;">Developed by <a href="#" id="about-credit-link" style="color:inherit; text-decoration:underline; cursor:pointer;">Naveen Raj Sivasamy</a></p>
      `;
      document.getElementById('about-credit-link').onclick = (e) => {
        e.preventDefault();
        window.statusApp.openExternal('https://www.linkedin.com/in/naveen-raj-sivasamy-603826196');
      };
      if (isAdmin) renderBackendStatus();
      const note = document.getElementById('ab-app-note');
      const checkBtn = document.getElementById('ab-check');
      const showState = (r) => {
        note.innerHTML = '';
        if (!r) { note.textContent = 'Could not check just now — try again in a minute.'; return; }
        if (r.state === 'latest') note.textContent = `You're on the latest version (v${r.version}).`;
        else if (r.state === 'downloading') note.textContent = `Version ${r.version} is downloading. Daylens will ask you to restart when it's ready.`;
        else if (r.state === 'ready') {
          note.textContent = `Version ${r.version} is ready. `;
          const b = document.createElement('button'); b.type = 'button'; b.className = 'mini-btn go'; b.id = 'ab-restart'; b.textContent = 'Restart now';
          b.onclick = () => { b.textContent = 'Restarting…'; window.statusApp.quitAndInstall(); };
          note.appendChild(b);

          note.textContent = r.mac === false
            ? `Version ${r.version} is available, but it couldn't download by itself. Download the installer and run it — your entries and settings stay. `
            : `Version ${r.version} is available. On a Mac, download it and drag it into Applications. `;
          const b = document.createElement('button'); b.type = 'button'; b.className = 'mini-btn go'; b.id = 'ab-download'; b.textContent = 'Download';

          note.appendChild(b);

        else if (r.state === 'off') note.textContent = 'This is a preview build — it doesn\'t update itself.';
        else note.textContent = 'Could not check just now — try again in a minute.' + (r.error ? ` (${r.error})` : '');
