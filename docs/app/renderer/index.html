        note.textContent = la.approvers.length ? 'It goes to the approver you pick, and counts as leave once they approve it.' : 'Nobody is set up as an approver yet, so this goes to any approver an admin marks in People.';
        formHost.appendChild(note);
      }
      if (pane) { linkInputsToPane(pane, inputs); pane.reload(); }

      // Keep the draft updated as they type/pick/toggle anything — 'input'
      // covers text/textarea/date, 'change' covers <select>, and 'click'
      // (bubbling up from a chip) covers multiselect chip-groups; readonly
      // fields (week-auto, sequence) are recomputed fresh every time this
      // form opens anyway, so there's nothing useful to persist for those.
      let submittedOk = false; // a change typed just before Submit mustn't bring the draft back after it's saved
      const scheduleDraftSave = debounce(() => {
        if (submittedOk) return;
        const values = {};
        Object.entries(inputs).forEach(([k, el]) => (values[k] = (el.value || '').trim()));
        saveDraft(tab, values);
      }, 400);
      Object.entries(inputs).forEach(([, el]) => {
        if (el.readOnly) return;
        const evt = el.tagName === 'SELECT' ? 'change' : el.classList.contains('chip-group') ? 'click' : 'input';
        el.addEventListener(evt, scheduleDraftSave);
      });

      // Wire up Date -> Week auto-fill for whichever columns are configured that way.
      // Matched case-insensitively since actual sheet headers may differ in case
      // from this config (e.g. "Assigned To" vs "Assigned to").
      const findInput = (name) => {
        const key = Object.keys(inputs).find(
          (k) => k.trim().toLowerCase() === String(name).trim().toLowerCase()
        );
        return key ? inputs[key] : null;
      };
      const spec = liveFieldSchema[tab] || {};
      Object.keys(spec).forEach((col) => {
        if (spec[col].type !== 'week-auto') return;
        // No "based on" set: the form's first date field.
        const dateInput = findInput(spec[col].basedOn) || Object.keys(inputs).map((k) => inputs[k]).find((el) => el && el.type === 'date');
        const weekInput = findInput(col);
        if (!dateInput || !weekInput) return;
        const sync = () => { weekInput.value = computeWeekLabel(dateInput.value); };
        dateInput.addEventListener('change', sync);
        sync();
      });
      warnDuplicateTicket(tab, inputs, null);

      // Auto-numbered columns (e.g. "Cleanup Number"): fetch the next value
      // — highest existing number in that column, plus one — as soon as the
      // form opens, based on what's actually on the sheet right now.
      Object.keys(spec).forEach((col) => {
        if (spec[col].type !== 'sequence') return;
        const seqInput = findInput(col);
        if (!seqInput) return;
        window.statusApp.getNextNumber(tab, col).then((res) => {
          seqInput.value = res && res.next != null ? res.next : '';
        }).catch(() => {
          seqInput.readOnly = false;
          seqInput.placeholder = 'Enter manually';
        });
      });

      els.footer.classList.remove('hidden');
      // Defensive, on top of the success-path fix above: whatever state
      // submitBtn was left in by anything that happened before this form
      // opened (a submit that's still technically in flight after Cancel,
      // some other edge case) never leaks into a form nobody has touched
      // yet — every fresh form starts clean, no exceptions.
      els.submitBtn.disabled = false;
      els.submitBtn.textContent = 'Submit';
      // Weekly Connect and any Excel-routed tab have no existing-entries
      // list to return to (see showTabPicker's onclick above) — Cancel
      // there still means the tab list. Every other tab's "Add New" form
      // was opened FROM its entries list, so Cancel should land back
      // there, not skip past it to the tab list two screens up.
      const noEntriesList = isTicketTab(tab) || liveDataSourceTypes[tab] === 'Excel';
      els.cancelBtn.onclick = () => (isTrendy() && isTicketTab(tab) && liveDataSourceTypes[tab] !== 'Excel' ? showTicketBoard(tab) : noEntriesList ? showTabPicker() : showTabEntries(tab));
      els.submitBtn.onclick = async () => {
        const values = {};
        Object.entries(inputs).forEach(([k, el]) => (values[k] = (el.value || '').trim()));
        if (la && la.approvers.length && !values.Approver) {
          const m = document.getElementById('leave-ap-msg');
          if (m) { m.className = 'inline-msg leave-ap-msg err'; m.textContent = 'Choose who approves your leave.'; }
          const sel = formHost.querySelector('.leave-approver');
          if (sel) sel.focus();
          return;
        }
        els.submitBtn.disabled = true;
        els.submitBtn.textContent = 'Saving…';
        try {
          const saved = await window.statusApp.submitEntry(tab, values);
          lastSavedRow = { tab, rowIndex: saved && saved.rowIndex ? saved.rowIndex : 'last' };
          submittedOk = true;
          clearDraft(tab); // it actually made it to the sheet — nothing left to restore next time
          // The catch below already resets these on failure — the success
          // path never did, so the button stayed stuck at disabled/"Saving…"
          // forever after every successful submit. Invisible right after a
          // normal submit (showSuccess hides the footer), but it resurfaced
          // the next time any form revealed the footer again, looking like
          // a fresh "stuck on Saving" report on a form nobody had touched yet.
          els.submitBtn.disabled = false;
          els.submitBtn.textContent = 'Submit';
          showSuccess(tab);
        } catch (err) {
          els.submitBtn.disabled = false;
          els.submitBtn.textContent = 'Submit';
          showError(err.message || String(err), () => showForm(tab));
        }
      };
    } catch (err) {
      showError(err.message || String(err), () => showForm(tab));
    }
  }

  // ---------------- CMS Weekly Connect: multi-query submit form ----------------
  // Replaces the old one-ticket-per-row Weekly Connect flow for this tab
  // entirely (see showTabPicker's routing above) — no entries list, no
  // per-row edit screen, no Post-to-Teams: this tab is one-and-done, all
  // of a meeting's queries submitted together as one row (see
  // submitCmsWeeklyConnect in Code.gs for how they're combined server-side).

  // One repeatable query/answer/status/assignee block. Kept as a plain DOM
  // builder (not wired into the generic buildFieldInput()/draft-saving
  // machinery showForm() uses) since this shape — a variable-length list
  // of these — is specific to this one tab, not a generic column.
  // One query/action of a Weekly meeting. opts.people: the team's names (an
  // owner from People gets a reminder); opts.carried: an action still open
  // from an earlier meeting ({id, query, answer, status, assignedTo, due, meeting}).
  function buildCmsQueryBlock(opts) {
    opts = opts || {};
    const c = opts.carried || null;
    const people = opts.people || [];
    const block = document.createElement('div');
    block.className = 'cms-query-block' + (c ? ' carried' : '');
    if (c) { block.dataset.rid = c.id; block.dataset.from = c.meeting || ''; }
    const statusOpts = ['Pending', 'In Progress', 'Done'].map((v) => `<option value="${v}"${c && c.status === v ? ' selected' : ''}>${v}</option>`).join('');
    const owner = c ? String(c.assignedTo || '').split(',')[0].trim() : '';
    const known = people.some((p) => p.toLowerCase() === owner.toLowerCase());
    const ownerField = people.length
      ? `<select class="cms-q-assigned"><option value="">— nobody yet —</option>${people.map((p) => `<option value="${escapeHtml(p)}"${known && p.toLowerCase() === owner.toLowerCase() ? ' selected' : ''}>${escapeHtml(p)}</option>`).join('')}<option value="__other"${owner && !known ? ' selected' : ''}>Someone else…</option></select>
         <input type="text" class="cms-q-assigned-other" placeholder="Their name" value="${owner && !known ? escapeHtml(owner) : ''}" ${owner && !known ? '' : 'hidden'} />`
      : `<input type="text" class="cms-q-assigned" value="${escapeHtml(owner)}" />`;
    block.innerHTML = `
      ${c ? `<div class="cms-carried-tag">Open since the ${escapeHtml(fmtMeetingDay(c.meeting))} meeting</div>` : '<button type="button" class="cms-remove-btn" title="Remove this query">✕</button>'}
      <div class="field"><label>Query</label><textarea class="cms-q-query" rows="2">${c ? escapeHtml(c.query) : ''}</textarea></div>
      <div class="field"><label>Answer</label><textarea class="cms-q-answer" rows="2">${c ? escapeHtml(c.answer || '') : ''}</textarea></div>
      <div class="cms-row">
        <div class="field"><label>Status</label><select class="cms-q-status">${statusOpts}</select></div>
        <div class="field"><label>Assigned To <span style="font-weight:400;">(optional)</span></label>${ownerField}</div>
        <div class="field"><label>Due <span style="font-weight:400;">(optional)</span></label><input type="date" class="cms-q-due" value="${c && c.due ? escapeHtml(c.due) : ''}" /></div>
      </div>
      <div class="cms-q-hint">${c ? 'Mark it Done when it\'s finished — that closes their reminder too.' : 'Someone from People gets a reminder: on the due date, or a week after the meeting.'}</div>
    `;
    const sel = block.querySelector('select.cms-q-assigned');
    if (sel) sel.onchange = () => {
      const other = sel.closest('.field').querySelector('.cms-q-assigned-other');
      other.hidden = sel.value !== '__other';
      if (!other.hidden) other.focus();
    };
    const rm = block.querySelector('.cms-remove-btn');
    if (rm) rm.onclick = () => {
      block.remove();
      // Never leave the form with zero blocks showing — nothing to
      // remove-down-to-nothing, there's just always at least one to fill in.
      const list = document.getElementById('cms-query-list');
      if (list && !list.children.length) list.appendChild(buildCmsQueryBlock({ people }));
    };
    return block;
  }
  function fmtMeetingDay(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
    if (!m) return 'earlier';
    return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  }
  function readCmsBlock(b) {
    const sel = b.querySelector('.cms-q-assigned');
    let who = sel ? sel.value.trim() : '';
    if (who === '__other') who = (b.querySelector('.cms-q-assigned-other').value || '').trim();
    const q = {
      query: b.querySelector('.cms-q-query').value.trim(),
      answer: b.querySelector('.cms-q-answer').value.trim(),
      status: b.querySelector('.cms-q-status').value,
      assignedTo: who,
      due: b.querySelector('.cms-q-due').value || '',
    };
    if (b.dataset.rid) { q.rid = b.dataset.rid; q.from = b.dataset.from || ''; }
    return q;
  }

  function showCmsWeeklyConnectForm(meetingTab) {
    setScreen(meetingTab, tabTrail());
    els.main.style.minHeight = '';
    els.main.innerHTML = `
      <div class="cms-error" id="cms-error" style="display:none;"></div>
      <div class="field"><label>Meeting Date</label><input type="date" id="cms-meeting-date" /></div>
      <div class="field"><label>Requester</label><input type="text" id="cms-requester" placeholder="Who requested this?" /></div>
      <div id="cms-carried" hidden><div class="cms-carried-head" id="cms-carried-head"></div><div id="cms-carried-list"></div></div>
      <div id="cms-query-list"></div>
      <button type="button" class="secondary" id="cms-add-query-btn" style="width:100%; margin:6px 0 2px;">+ Add Query</button>
    `;
    const list = document.getElementById('cms-query-list');
    let people = [];
    list.appendChild(buildCmsQueryBlock({ people }));
    document.getElementById('cms-add-query-btn').onclick = () => list.appendChild(buildCmsQueryBlock({ people }));
    // The team's names (owners get reminders) and actions still open from
    // earlier meetings — both quick reads, filled in when they arrive.
    Promise.all([
      window.statusApp.listUserNames().catch(() => null),
      window.statusApp.getMeetingOpenActions(meetingTab).catch(() => null),
    ]).then(([namesRes, openRes]) => {
      if (!document.body.contains(list)) return;
      people = (namesRes && namesRes.ok && namesRes.usernames) || [];
      // Blocks already on screen get the People drop-down in place (nothing typed is touched).
      if (people.length) Array.from(list.querySelectorAll('.cms-query-block')).forEach((b) => {
        const old = b.querySelector('input.cms-q-assigned');
        if (!old || old.value) return;
        const fresh = buildCmsQueryBlock({ people });
        const field = old.closest('.field');
        const nf = fresh.querySelector('select.cms-q-assigned').closest('.field');
        field.replaceWith(nf);
      });
      const open = (openRes && openRes.ok && openRes.actions) || [];
      if (open.length) {
        document.getElementById('cms-carried').hidden = false;
        document.getElementById('cms-carried-head').textContent = `Still open from earlier meetings (${open.length})`;
        const host = document.getElementById('cms-carried-list');
        open.forEach((a) => host.appendChild(buildCmsQueryBlock({ people, carried: a })));
      }
    });
    // Defaults to today — the meeting this is almost always being filled
    // in right after, same reasoning as auto-numbered/auto-week fields
    // elsewhere saving a step for the common case.
    document.getElementById('cms-meeting-date').value = new Date().toISOString().slice(0, 10);

    const errBox = document.getElementById('cms-error');
    const showCmsError = (msg) => { errBox.textContent = msg; errBox.style.display = 'block'; };
    const hideCmsError = () => { errBox.style.display = 'none'; };

    els.footer.classList.remove('hidden');
    els.submitBtn.disabled = false;
    els.submitBtn.textContent = 'Submit';
    els.cancelBtn.onclick = () => showTabPicker();

    els.submitBtn.onclick = async () => {
      hideCmsError();
      const requester = document.getElementById('cms-requester').value.trim();
      const meetingDate = document.getElementById('cms-meeting-date').value;
      const queries = Array.from(document.querySelectorAll('#cms-carried-list .cms-query-block, #cms-query-list .cms-query-block')).map(readCmsBlock).filter((q) => q.query);

      // Validated inline, without wiping the form — showError()'s "Retry"
      // re-renders a blank screen, which would be a rough way to lose
      // several already-typed queries over one missing field.
      if (!requester) return showCmsError('Requester is required.');
      if (!meetingDate) return showCmsError('Meeting Date is required.');
      if (!queries.length) return showCmsError('Add at least one query (with its Query field filled in).');

      els.submitBtn.disabled = true;
      els.submitBtn.textContent = 'Saving…';
      try {
        const saved = await window.statusApp.submitCmsWeeklyConnect({ tab: meetingTab, meetingDate, requester, queries });
        els.submitBtn.disabled = false;
        els.submitBtn.textContent = 'Submit';
        const a = (saved && saved.actions) || {};
        const bits = [];
        if (a.created) bits.push(`${a.created} reminder${a.created === 1 ? '' : 's'} sent`);
        if (a.closed) bits.push(`${a.closed} action${a.closed === 1 ? '' : 's'} closed`);
        showSuccess(meetingTab, bits.join(', '));
      } catch (err) {
        els.submitBtn.disabled = false;
        els.submitBtn.textContent = 'Submit';
        showCmsError(err.message || String(err));
      }
    };
  }

  // -------------------- Sheet split view --------------------
  // The right-hand pane: this tab's actual rows, read from the Google
  // Sheet (getTabRows), laid out like the Sheet itself (row numbers,
  // columns in sheet order). While you type, the row you're adding or
  // editing is highlighted and updates live, with the cell you're in
  // outlined; after a save it re-reads the Sheet and marks the saved row
  // green — so what you see there is what's really in the Sheet.
  // "Open in Google Sheets" opens the real sheet at that exact row.
  const SHEET_PANE_MAX_ROWS = 40;

  function splitEligible(tab) {
    return !isTicketTab(tab) && !isMeetingTab(tab) && liveDataSourceTypes[tab] !== 'Excel';
  }

  // Builds <div.split>[left][pane] into els.main; returns { left, pane }.
  function makeSplitLayout() {
    document.getElementById('card').classList.add('wide');
    const split = document.createElement('div');
    split.className = 'split';
    const left = document.createElement('div');
    left.className = 'split-left';
    const paneEl = document.createElement('aside');
    paneEl.className = 'sheet-pane';
    paneEl.id = 'sheet-pane';
    split.appendChild(left);
    split.appendChild(paneEl);
    els.main.appendChild(split);
    return { left, paneEl };
  }

  function createSheetPane(paneEl, tab, opts) {
    const pane = {
      tab, rows: [], gid: null, headers: [],
      mode: opts.mode || 'view', // 'new' | 'edit' | 'view'
      rowIndex: opts.rowIndex || null, // edit: the row being edited; view: the row to mark saved
      live: {}, focusCol: null, savedRow: opts.savedRow || null,
      loadedAt: null, error: null,
    };
    paneEl.innerHTML = `
      <div class="sheet-pane-head">
        <span class="sheet-pane-title">In the Sheet · ${escapeHtml(tab)}</span>
        <span class="sheet-pane-status" id="sheet-pane-status">Reading the Sheet…</span>
        <button type="button" class="open-sheet-btn" id="open-sheet-at-btn" title="Open the real Google Sheet with this row selected">Open in Google Sheets ↗</button>
      </div>
      <div class="sheet-scroll" id="sheet-scroll"></div>
      <div class="sheet-pane-note" id="sheet-pane-note"></div>`;
    // Opening the real Sheet is for admins (it isn't shared with everyone).
    window.statusApp.getSessionStatus().then((st) => {
      const b = paneEl.querySelector('#open-sheet-at-btn');
      if (b && !(st && st.role === 'Admin')) b.hidden = true;
    }).catch(() => {});
    const statusEl = paneEl.querySelector('#sheet-pane-status');
    const scrollEl = paneEl.querySelector('#sheet-scroll');
    const noteEl = paneEl.querySelector('#sheet-pane-note');

    pane.targetRow = () => {
      if (pane.mode === 'edit' || pane.mode === 'hover') return pane.rowIndex;
      if (pane.mode === 'new') return nextRowIndex();
      return pane.savedRow;
    };
    const nextRowIndex = () => (pane.rows.length ? Math.max.apply(null, pane.rows.map((r) => r.rowIndex)) + 1 : 2);

    paneEl.querySelector('#open-sheet-at-btn').onclick = () => {
      const row = pane.mode === 'new' ? null : pane.targetRow(); // a not-yet-saved row doesn't exist in the Sheet yet
      window.statusApp.openSheetAt(pane.gid, row || (pane.rows.length ? nextRowIndex() - 1 : null), Math.max(pane.headers.length, 1));
    };

    pane.render = () => {
      if (pane.error) { statusEl.textContent = pane.error; scrollEl.innerHTML = ''; return; }
      if (!pane.loadedAt) return;
      const headers = pane.headers;
      const sorted = pane.rows.slice().sort((a, b) => a.rowIndex - b.rowIndex);
      const target = pane.targetRow();
      // Keep the window of rows around the one that matters.
      let shown = sorted;
      if (sorted.length > SHEET_PANE_MAX_ROWS) {
        const pos = target ? sorted.findIndex((r) => r.rowIndex === target) : -1;
        const end = pos === -1 ? sorted.length : Math.min(sorted.length, pos + 10);
        shown = sorted.slice(Math.max(0, end - SHEET_PANE_MAX_ROWS), end);
      }
      const cell = (v) => escapeHtml(v == null ? '' : String(v));
      let html = '<table class="sheet-grid"><thead><tr><th class="rownum"></th>' +
        headers.map((h) => `<th data-col="${escapeHtml(h)}" class="${h === pane.focusCol ? 'focus' : ''}">${escapeHtml(h)}</th>`).join('') + '</tr></thead><tbody>';
      if (shown.length < sorted.length) html += `<tr><td class="rownum">…</td><td colspan="${headers.length}" style="color:#5f6368;">${sorted.length - shown.length} earlier rows not shown</td></tr>`;
      shown.forEach((r) => {
        const isEdit = (pane.mode === 'edit' || pane.mode === 'hover') && r.rowIndex === pane.rowIndex;
        const isSaved = pane.mode === 'view' && r.rowIndex === pane.savedRow;
        const cls = isEdit ? 'hl' : isSaved ? 'saved' : '';
        html += `<tr class="${cls}" data-row="${r.rowIndex}"><td class="rownum">${r.rowIndex}</td>` + headers.map((h) => {
          const live = isEdit && Object.prototype.hasOwnProperty.call(pane.live, h) ? pane.live[h] : null;
          const val = live !== null ? live : r.values[h];
          const changed = live !== null && String(live) !== String(r.values[h] == null ? '' : r.values[h]);
          const c = [isEdit && h === pane.focusCol ? 'focus' : '', changed ? 'changed' : ''].join(' ').trim();
          return `<td class="${c}" title="${cell(val)}">${cell(val)}</td>`;
        }).join('') + '</tr>';
      });
      if (pane.mode === 'new') {
        html += `<tr class="new" data-row="new"><td class="rownum">${nextRowIndex()}</td>` + headers.map((h) => {
          const v = pane.live[h];
          return `<td class="${h === pane.focusCol ? 'focus' : ''}">${cell(v == null || v === '' ? '' : v)}</td>`;
        }).join('') + '</tr>';
      }
      html += '</tbody></table>';
      scrollEl.innerHTML = html;
      const hl = scrollEl.querySelector('tr.hl, tr.new, tr.saved');
      if (hl) hl.scrollIntoView({ block: 'nearest' });
      const fc = scrollEl.querySelector('td.focus');
      if (fc) fc.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      const t = pane.loadedAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      if (pane.mode === 'view' && pane.savedRow && pane.rows.some((r) => r.rowIndex === pane.savedRow)) {
        statusEl.className = 'sheet-pane-status ok';
        statusEl.textContent = `✓ Row ${pane.savedRow} saved — re-read from the Sheet at ${t}`;
      } else {
        statusEl.className = 'sheet-pane-status';
        statusEl.textContent = `Live from the Sheet · read at ${t}`;
      }
      noteEl.textContent = pane.mode === 'new'
        ? `Yellow row ${nextRowIndex()} is what will be added when you submit. The blue cell is the field you're in.`
        : pane.mode === 'edit'
          ? `Yellow row ${pane.rowIndex} is the one you're editing — bold cells are your changes. Nothing changes in the Sheet until you Save.`
          : '';
    };

    // Called by the form as you type / move between fields.
    pane.setLive = (values, focusCol) => {
      pane.live = values;
      if (focusCol !== undefined) pane.focusCol = focusCol;
      pane.render();
    };

    pane.reload = async () => {
      try {
        const res = await window.statusApp.getTabRows(tab);
        pane.rows = (res && res.rows) || [];
        pane.gid = res && res.gid != null ? res.gid : null;
        const keys = [];
        pane.rows.forEach((r) => Object.keys(r.values).forEach((k) => { if (keys.indexOf(k) === -1) keys.push(k); }));
        (opts.columns || []).forEach((c) => { if (keys.indexOf(c) === -1) keys.push(c); });
        pane.headers = keys;
        pane.loadedAt = new Date();
        pane.error = null;
      } catch (err) {
        pane.error = "Couldn't read the Sheet: " + (err.message || String(err));
      }
      pane.render();
      return pane;
    };
    return pane;
  }

  // Wires a form's inputs to the pane: live values + which field you're in.
  function linkInputsToPane(pane, inputs) {
    const collect = () => {
      const v = {};
      Object.entries(inputs).forEach(([k, el]) => (v[k] = (el.value || '').trim()));
      return v;
    };
    let focusCol = null;
    const update = debounce(() => pane.setLive(collect(), focusCol), 120);
    Object.entries(inputs).forEach(([col, el]) => {
      ['input', 'change', 'click'].forEach((evt) => el.addEventListener(evt, update));
      el.addEventListener('focusin', () => { focusCol = col; pane.setLive(collect(), col); });
    });
    pane.live = collect();
  }

  // -------------------- Existing entries: list / edit / delete --------------------
  // What a tab click opens for every tab except Weekly Connect (see
  // showTabPicker) — the entries already on that sheet tab, instead of a
  // blank add-entry form. Generic across every tab: it works off whatever
  // getTabRows() returns for that tab's actual columns, with no per-tab
  // special-casing beyond deliberately excluding Weekly Connect above.

  // {tab, rowIndex} of the last row this person saved — the entries list's
  // sheet pane marks it green after re-reading the Sheet. 'last' = a new
  // row from a backend too old to report its row number (assume the end).
  let lastSavedRow = null;

  async function showTabEntries(tab) {
    const scr = beginScreen(); // a newer screen takes over: this one stops drawing
    setScreen(tab, tabTrail());
    els.footer.classList.add('hidden');
    els.main.style.minHeight = '';
    showLoading('Loading entries…');
    try {
      const res = await window.statusApp.getTabRows(tab);
      if (scr.stale) return;
      renderTabEntries(tab, (res && res.rows) || [], res);
    } catch (err) {
      showError(err.message || String(err), () => showTabEntries(tab));
    }
  }

  // Picks a "title" + up to two "subtitle" fields to show on a card,
  // generically, without knowing this tab's columns ahead of time: a
  // Name/Title-like column wins if there is one (most tabs have one),
  // otherwise whichever column has real content first. Object.keys
  // preserves the sheet's actual column order here (see getTabRows_ in
  // Code.gs, which builds `values` by iterating headers in order).
  function entryCardFields(values) {
    const keys = Object.keys(values).filter(
      (k) => k !== 'Timestamp' && String(values[k] == null ? '' : values[k]).trim()
    );
    const primary = keys.find((k) => /^(name|title)$/i.test(k.trim())) || keys[0] || null;
    const rest = keys.filter((k) => k !== primary).slice(0, 2);
    return { primary, rest };
  }

  function buildEntryCard(tab, row) {
    const { primary, rest } = entryCardFields(row.values);
    const card = document.createElement('div');
    card.className = 'entry-card';

    const openBtn = document.createElement('button');
    openBtn.type = 'button';
    openBtn.className = 'entry-card-open';
    const leaveSt = liveTabTypes[tab] === 'leave' ? String(row.values.Status || '').trim() : '';
    openBtn.innerHTML = `
      <span class="entry-card-title">${escapeHtml(primary ? String(row.values[primary]) : '(no details)')}${/^(Pending|Approved|Rejected)$/.test(leaveSt) ? stChip(leaveSt) : ''}</span>
      ${rest.length ? `<span class="entry-card-sub">${rest.map((k) => escapeHtml(String(row.values[k]))).join(' · ')}</span>` : ''}
    `;
    openBtn.onclick = () => showEntryEdit(tab, row);
    card.appendChild(openBtn);

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'entry-delete-btn';
    delBtn.title = 'Remove this entry';
    delBtn.textContent = '🗑';
    delBtn.onclick = async (e) => {
      e.stopPropagation();
      if (!window.confirm('Remove this entry? This can’t be undone.')) return;
      delBtn.disabled = true;
      try {
        const result = await window.statusApp.deleteTabRow(tab, row.rowIndex, row.values);
        if (!result || result.ok === false) throw new Error((result && result.error) || 'Delete failed.');
        showTabEntries(tab); // re-fetch rather than just removing the card — row numbers below it just shifted
      } catch (err) {
        delBtn.disabled = false;
        window.alert(err.message || String(err));
      }
    };
    card.appendChild(delBtn);

    return card;
  }

  function renderTabEntries(tab, rows, res) {
    els.main.innerHTML = '';
    let host = els.main;
    let pane = null;
    if (splitEligible(tab)) {
      const layout = makeSplitLayout();
      host = layout.left;
      let savedRow = null;
      if (lastSavedRow && lastSavedRow.tab === tab) {
        savedRow = lastSavedRow.rowIndex === 'last'
          ? (rows.length ? Math.max.apply(null, rows.map((r) => r.rowIndex)) : null)
          : lastSavedRow.rowIndex;
        lastSavedRow = null; // show the green confirmation once
      }
      pane = createSheetPane(layout.paneEl, tab, { mode: 'view', savedRow });
      // Same data the list just fetched — no second read needed.
      pane.rows = rows;
      pane.gid = res && res.gid != null ? res.gid : null;
      const keys = [];
      rows.forEach((r) => Object.keys(r.values).forEach((k) => { if (keys.indexOf(k) === -1) keys.push(k); }));
      pane.headers = keys;
      pane.loadedAt = new Date();
    }

    host.appendChild(tileGrid([
      makeTile({ id: 'add-new-tile', icon: '＋', title: 'Add new entry', hint: `Opens a blank ${tab} form`, variant: 'add', onClick: () => showForm(tab) }),
    ].concat(liveTabTypes[tab] === 'leave' ? [makeTile({ id: 'lc-tile', icon: '📅', title: 'Leave calendar', hint: 'Who\'s off, and when — month or year, with holidays', onClick: () => { lcState.person = ''; if (lcState.view === 'list') lcState.view = 'month'; showLeaveCalendar(tab); } })] : []), true));

    if (!rows.length) {
      const empty = document.createElement('div');
      empty.className = 'entries-empty';
      empty.textContent = 'Nothing here yet — add the first entry above.';
      host.appendChild(empty);
    } else {
      // Long lists: a search box, and the list scrolls in its own box —
      // newest at the bottom, like the Sheet, and scrolled there.
      const listBox = document.createElement('div');
      listBox.className = 'scroll-list entries-list';
      const count = document.createElement('div');
      count.className = 'list-count';
      const cards = rows.map((row) => {
        const card = buildEntryCard(tab, row);
        card.dataset.search = Object.values(row.values).join(' ').toLowerCase();
        // Hovering an entry points at its row in the Sheet pane.
        if (pane) {
          card.addEventListener('mouseenter', () => { pane.mode = 'hover'; pane.rowIndex = row.rowIndex; pane.live = {}; pane.focusCol = null; pane.render(); });
          card.addEventListener('mouseleave', () => { pane.mode = 'view'; pane.rowIndex = null; pane.render(); });
        }
        listBox.appendChild(card);
        return card;
      });
      const showCount = (n) => { count.textContent = n === rows.length ? `${rows.length} ${rows.length === 1 ? 'entry' : 'entries'}` : `${n} of ${rows.length} entries`; };
      if (rows.length > 12) {
        const filter = document.createElement('input');
        filter.type = 'search';
        filter.className = 'list-filter';
        filter.id = 'entries-filter';
        filter.placeholder = 'Search these entries…';
        filter.oninput = () => {
          const q = filter.value.trim().toLowerCase();
          let n = 0;
          cards.forEach((c) => { const hit = !q || c.dataset.search.includes(q); c.hidden = !hit; if (hit) n++; });
          showCount(n);
        };
        host.appendChild(filter);
      }
      showCount(rows.length);
      host.appendChild(count);
      host.appendChild(listBox);
      requestAnimationFrame(() => { listBox.scrollTop = listBox.scrollHeight; });
    }

    // The way back is the trail at the top ("← Back · Home › …"), so it
    // stays in view however long the list is.
    if (pane) pane.render();
  }

  // Editing an existing row — same field set/widgets as showForm (via
  // buildFieldInput) so a select/multiselect/richtext/url/attachment
  // column behaves identically whether you're adding or editing, just
  // pre-filled and saved with updateTabRow instead of submitEntry.
  // Deliberately doesn't touch the "Add New" draft cache (loadDraft/
  // saveDraft) — that's for an in-progress NEW entry, not an edit of
  // something already saved. Sequence columns keep their existing stored
  // value rather than re-fetching "next number" (that's only for new
  // rows); week-auto still re-syncs if the date is changed here.
  function showEntryEdit(tab, row) {
    setScreen(tab, tabTrail().concat([{ label: tab, go: () => showTabEntries(tab) }]));
    els.footer.classList.add('hidden');
    els.main.style.minHeight = '';
    showLoading('Loading fields…');
    Promise.all([window.statusApp.getColumns(tab), leaveApprovalFor(tab), freshDirOptions(tab)]).then(([{ columns: rawColumns }, la]) => {
      const columns = leaveColumns(rawColumns, la);
      els.main.innerHTML = '';
      const inputs = {};
      let formHost = els.main;
      let pane = null;
      if (splitEligible(tab)) {
        const layout = makeSplitLayout();
        formHost = layout.left;
        pane = createSheetPane(layout.paneEl, tab, { mode: 'edit', rowIndex: row.rowIndex, columns });
      }
      const leaveStatus = la ? String(row.values.Status || '').trim() : '';
      if (la && leaveStatus) {
        const st = document.createElement('div');
        st.className = 'inline-msg leave-ap-msg';
        st.id = 'leave-ap-msg';
        st.innerHTML = `This request: ${stChip(leaveStatus)}${leaveStatus !== 'Pending' && row.values.Approver ? ' by ' + escapeHtml(row.values.Approver) : ''}${row.values['Decision note'] ? ' — “' + escapeHtml(row.values['Decision note']) + '”' : ''}. Changing the date or type asks for approval again.`;
        formHost.appendChild(st);
      }
      columns.forEach((col) => {
        const lc = col.trim().toLowerCase();
        const wrap = document.createElement('div');
        wrap.className = 'field';
        const label = document.createElement('label');
        label.textContent = col;
        let input;
        if (la && lc === 'approver') input = approverSelect(la, row.values[col], !leaveStatus || leaveStatus === 'Pending');
        else {
          input = buildFieldInput(tab, col, row.values[col]);
          if (la && LEAVE_SYS_COLS.includes(lc)) { input.disabled = true; input.readOnly = true; } // the approver's to fill in
        }
        wrap.appendChild(label);
        wrap.appendChild(input);
        formHost.appendChild(wrap);
        inputs[col] = input;
      });
      if (pane) { linkInputsToPane(pane, inputs); pane.reload(); }

      const findInput = (name) => {
        const key = Object.keys(inputs).find(
          (k) => k.trim().toLowerCase() === String(name).trim().toLowerCase()
        );
        return key ? inputs[key] : null;
      };
      const spec = liveFieldSchema[tab] || {};
      Object.keys(spec).forEach((col) => {
        if (spec[col].type !== 'week-auto') return;
        // No "based on" set: the form's first date field.
        const dateInput = findInput(spec[col].basedOn) || Object.keys(inputs).map((k) => inputs[k]).find((el) => el && el.type === 'date');
        const weekInput = findInput(col);
        if (!dateInput || !weekInput) return;
        dateInput.addEventListener('change', () => { weekInput.value = computeWeekLabel(dateInput.value); });
      });
      warnDuplicateTicket(tab, inputs, row.rowIndex);

      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex; gap:8px; margin-top:10px;';

      const backBtn = document.createElement('button');
      backBtn.type = 'button';
      backBtn.className = 'secondary';
      backBtn.style.flex = '1';
      backBtn.textContent = '← Back';
      backBtn.onclick = () => showTabEntries(tab);

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'secondary';
      delBtn.style.flex = '1';
      delBtn.textContent = '🗑 Delete';
      delBtn.onclick = async () => {
        if (!window.confirm('Remove this entry? This can’t be undone.')) return;
        delBtn.disabled = true;
        try {
          const result = await window.statusApp.deleteTabRow(tab, row.rowIndex, row.values);
          if (!result || result.ok === false) throw new Error((result && result.error) || 'Delete failed.');
          showTabEntries(tab);
        } catch (err) {
          delBtn.disabled = false;
          window.alert(err.message || String(err));
        }
      };

      const saveBtn = document.createElement('button');
      saveBtn.type = 'button';
      saveBtn.className = 'primary';
      saveBtn.style.flex = '1';
      saveBtn.textContent = 'Save';
      saveBtn.onclick = async () => {
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving…';
        const values = {};
        Object.entries(inputs).forEach(([k, el]) => (values[k] = (el.value || '').trim()));
        try {
          const result = await window.statusApp.updateTabRow(tab, row.rowIndex, values, row.values);
          if (!result || result.ok === false) throw new Error((result && result.error) || 'Save failed.');
          lastSavedRow = { tab, rowIndex: row.rowIndex };
          showResult({
            success: true,
            title: 'Entry Updated',
            subtitle: `Saved to "${tab}".`,
            doneLabel: 'Done',
            onDone: () => showTabEntries(tab),
          });
        } catch (err) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save';
          showError(err.message || String(err), () => showEntryEdit(tab, row));
        }
      };

      actions.appendChild(backBtn);
      actions.appendChild(delBtn);
      actions.appendChild(saveBtn);
      formHost.appendChild(actions);
    }).catch((err) => {
      showError(err.message || String(err), () => showEntryEdit(tab, row));
    });
  }

  // -------------------- Weekly Connect: view & update tickets --------------------
  // Fetched fresh every time this screen opens (never cached) — see the
  // comment on the 'weeklyConnectTickets' action in Code.gs for why:
  // picking a ticket to update needs the real current state.

  let wcTickets = []; // last fetch — filtering below re-renders from this, no extra network call
  // Closed questions get their own tab instead of hiding behind a generic
  // "All" toggle — Resolved/Deferred is genuinely a different list people
  // look at for a different reason (history/reference) than the live
  // open-to-pending agenda, which is what "Open" defaults to.
  let wcTab = 'open'; // 'open' | 'closed'
  // Collapsed by default on purpose — filters exist for whoever needs
  // them, but the common case (glance at what's open) shouldn't have to
  // look past a wall of search/chip controls to get there.
  let wcFiltersExpanded = false;
  let wcSearch = '';
  let wcStatusFilter = []; // multiselect — values are whatever Status strings actually exist
  let wcRequesterFilter = [];
  let wcOwnerFilter = [];
  let wcDateFrom = '';
  let wcDateTo = '';
  const WC_CLOSED_STATUSES = ['Resolved', 'Deferred'];

  function wcActiveFilterCount() {
    return (wcSearch.trim() ? 1 : 0) + (wcStatusFilter.length ? 1 : 0) +
      (wcRequesterFilter.length ? 1 : 0) + (wcOwnerFilter.length ? 1 : 0) +
      (wcDateFrom || wcDateTo ? 1 : 0);
  }

  function wcClearFilters() {
    wcSearch = ''; wcStatusFilter = []; wcRequesterFilter = []; wcOwnerFilter = [];
    wcDateFrom = ''; wcDateTo = '';
  }

  // Whichever tab is active, before any of the filter panel's own filters
  // are applied on top.
  function wcBaseTickets() {
    return wcTickets.filter((t) => {
      const isClosed = WC_CLOSED_STATUSES.indexOf(t.Status || '') !== -1;
      return wcTab === 'closed' ? isClosed : !isClosed;
    });
  }

  // Chip options are always exactly what's actually present in the
  // current tab's tickets — never a fixed list that could offer a
  // Status/Requester/Owner nothing in view actually has.
  function wcDistinctValues(base, field) {
    const seen = new Set();
    base.forEach((t) => { if (t[field]) seen.add(t[field]); });
    return Array.from(seen).sort();
  }

  // "search questions and give them in result if any word matches" —
  // splits the query into words, matches if ANY of them appears anywhere
  // in the ticket's Issue/Comments/Requester/Owner (case-insensitive).
  function wcApplyFilters(base) {
    const words = wcSearch.trim().toLowerCase().split(/\s+/).filter(Boolean);
    return base.filter((t) => {
      if (wcStatusFilter.length && wcStatusFilter.indexOf(t.Status || '') === -1) return false;
      if (wcRequesterFilter.length && wcRequesterFilter.indexOf(t.Requester || '') === -1) return false;
      if (wcOwnerFilter.length && wcOwnerFilter.indexOf(t.Owner || '') === -1) return false;
      // t.Date is 'yyyy-MM-dd' (see getWeeklyConnectTickets in Code.gs), same
      // as what <input type="date"> gives back — plain string comparison
      // sorts correctly for ISO dates, no need to parse either side.
      if (wcDateFrom && (!t.Date || t.Date < wcDateFrom)) return false;
      if (wcDateTo && (!t.Date || t.Date > wcDateTo)) return false;
      if (words.length) {
        const haystack = [t.Issue, t.Comments, t.Requester, t.Owner].filter(Boolean).join(' ').toLowerCase();
        if (!words.some((w) => haystack.indexOf(w) !== -1)) return false;
      }
      return true;
    });
  }

  async function showWeeklyConnectTickets() {
    const scr = beginScreen(); // a newer screen takes over: this one stops drawing
    setScreen(`${currentTicketTab || 'Tickets'} — tickets`, tabTrail().concat(currentTicketTab ? [{ label: currentTicketTab, go: () => openTab(currentTicketTab) }] : []));
    els.footer.classList.add('hidden');
    els.main.style.minHeight = '';
    showLoading('Loading tickets…');
    try {
      const res = await window.statusApp.getWeeklyConnectTickets(currentTicketTab);
      if (scr.stale) return;
      wcTickets = (res && res.tickets) || [];
      renderWeeklyConnectList();
    } catch (err) {
      showError(err.message || String(err), showWeeklyConnectTickets);
    }
  }

  // Whole days between `dateStr` (t.Date, already yyyy-MM-dd from the
  // server) and now — null on anything unparsable so callers can skip
  // the badge instead of showing "NaNd open". Purely a display computation:
  // nothing server-side depends on this, same as the existing `stale` flag.
  function daysOpen(dateStr) {
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return null;
    return Math.max(0, Math.floor((Date.now() - d.getTime()) / (24 * 60 * 60 * 1000)));
  }

  function agingBadgeClass(days) {
    if (days >= STALE_TICKET_DAYS_CLIENT) return 'aging-late';
    if (days >= Math.ceil(STALE_TICKET_DAYS_CLIENT / 3)) return 'aging-warn';
    return 'aging-fresh';
  }

  // Mirrors Code.gs's own STALE_TICKET_DAYS (21) — only used here to color
  // the aging badge's three bands, not to decide staleness itself (the
  // server-computed `t.stale` still owns that).
  const STALE_TICKET_DAYS_CLIENT = 21;

  function wcBuildTicketCard(t) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'wc-ticket-btn';
    const statusClass = 'status-' + String(t.Status || '').toLowerCase().replace(/\s+/g, '-');
    const priorityClass = 'priority-' + String(t.Priority || '').toLowerCase();
    const openDays = t.Status === 'Open' ? daysOpen(t.Date) : null;
    btn.innerHTML = `
      <div class="wc-ticket-top">
        <span class="wc-ticket-id">#${escapeHtml(t['Ticket ID'])}</span>
        <div class="wc-badges">
          ${openDays != null ? `<span class="badge ${agingBadgeClass(openDays)}">${openDays}d open</span>` : ''}
          ${t.stale ? '<span class="badge stale">Stale</span>' : ''}
          ${t.Priority ? `<span class="badge ${priorityClass}">${escapeHtml(t.Priority)}</span>` : ''}
          ${t.Status ? `<span class="badge ${statusClass}">${escapeHtml(t.Status)}</span>` : ''}
        </div>
      </div>
      <div class="wc-ticket-issue">${escapeHtml(stripMarkdown(t.Issue) || '(no description)')}</div>
      <div class="wc-ticket-meta">${t.Group ? escapeHtml(t.Group) + ' · ' : ''}${escapeHtml(t.Requester || 'Unknown')} · ${escapeHtml(t.Date || '')}</div>
    `;
    btn.onclick = () => showWeeklyConnectEdit(t);
    return btn;
  }

  // Split out from the full render so typing in the search box only ever
  // touches this container — re-rendering the whole screen on every
  // keystroke would recreate the search <input> itself and throw away
  // focus/cursor position mid-type. Chips/dates/tabs still trigger a full
  // re-render (nothing being actively typed into there), just search.
  // Also refreshes the "Filters (N)" toggle label and Clear button by id
  // — those live outside this container, but search is the one filter
  // that only ever calls this narrower function, so its count/Clear
  // visibility would otherwise go stale the moment search became the
  // only active filter (caught by testing this directly, not assumed).
  function renderWcResults() {
    const container = document.getElementById('wc-results');
    if (!container) return;
    container.innerHTML = '';
    const visible = wcApplyFilters(wcBaseTickets());
    if (!visible.length) {
      const empty = document.createElement('div');
      empty.className = 'wc-empty';
      empty.textContent = wcActiveFilterCount()
        ? 'No tickets match these filters.'
        : (wcTab === 'closed' ? 'No closed tickets yet.' : 'No open tickets right now.');
      container.appendChild(empty);
    } else {
      visible.forEach((t) => container.appendChild(wcBuildTicketCard(t)));
    }
    const toggleBtn = document.getElementById('wc-filter-toggle-btn');
    if (toggleBtn) {
      const activeCount = wcActiveFilterCount();
      toggleBtn.textContent = (wcFiltersExpanded ? '▾ ' : '▸ ') + 'Filters' + (activeCount ? ` (${activeCount})` : '');
      const clearBtn = document.getElementById('wc-filter-clear-btn');
      if (activeCount && !clearBtn) {
        const newClearBtn = document.createElement('button');
        newClearBtn.type = 'button';
        newClearBtn.id = 'wc-filter-clear-btn';
        newClearBtn.className = 'wc-filter-clear-btn';
        newClearBtn.textContent = 'Clear';
        newClearBtn.onclick = () => { wcClearFilters(); renderWeeklyConnectList(); };
        toggleBtn.parentElement.appendChild(newClearBtn);
      } else if (!activeCount && clearBtn) {
        clearBtn.remove();
      }
    }
  }

  function renderWeeklyConnectList() {
    els.main.innerHTML = '';

    const tabRow = document.createElement('div');
    tabRow.className = 'wc-filter-row';
    [['open', 'Open'], ['closed', 'Closed']].forEach(([key, label]) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'wc-filter-btn' + (wcTab === key ? ' active' : '');
      btn.textContent = label;
      btn.onclick = () => { wcTab = key; renderWeeklyConnectList(); };
      tabRow.appendChild(btn);
    });
    els.main.appendChild(tabRow);

    const base = wcBaseTickets();
    const activeCount = wcActiveFilterCount();

    const toggleRow = document.createElement('div');
    toggleRow.className = 'wc-filter-toggle-row';
    const toggleBtn = document.createElement('button');
    toggleBtn.type = 'button';
    toggleBtn.id = 'wc-filter-toggle-btn';
    toggleBtn.className = 'wc-filter-toggle-btn';
    toggleBtn.textContent = (wcFiltersExpanded ? '▾ ' : '▸ ') + 'Filters' + (activeCount ? ` (${activeCount})` : '');
    toggleBtn.onclick = () => { wcFiltersExpanded = !wcFiltersExpanded; renderWeeklyConnectList(); };
    toggleRow.appendChild(toggleBtn);
    if (activeCount) {
      const clearBtn = document.createElement('button');
      clearBtn.type = 'button';
      clearBtn.id = 'wc-filter-clear-btn';
      clearBtn.className = 'wc-filter-clear-btn';
      clearBtn.textContent = 'Clear';
      clearBtn.onclick = () => { wcClearFilters(); renderWeeklyConnectList(); };
      toggleRow.appendChild(clearBtn);
    }
    els.main.appendChild(toggleRow);

    if (wcFiltersExpanded) {
      const panel = document.createElement('div');
      panel.className = 'wc-filter-panel';

      const searchWrap = document.createElement('div');
      searchWrap.className = 'field';
      const searchLabel = document.createElement('label');
      searchLabel.textContent = 'Search';
      searchWrap.appendChild(searchLabel);
      const searchInput = document.createElement('input');
      searchInput.type = 'text';
      searchInput.placeholder = 'Search questions, comments, people…';
      searchInput.value = wcSearch;
      searchInput.oninput = debounce(() => {
        wcSearch = searchInput.value;
        renderWcResults(); // results only — see renderWcResults' own comment for why
      }, 250);
      searchWrap.appendChild(searchInput);
      panel.appendChild(searchWrap);

      const buildChipFilter = (label, field, selectedArr) => {
        const options = wcDistinctValues(base, field);
        if (!options.length) return null;
        const wrap = document.createElement('div');
        wrap.className = 'field';
        const labelEl = document.createElement('label');
        labelEl.textContent = label;
        wrap.appendChild(labelEl);
        const group = document.createElement('div');
        group.className = 'chip-group';
        options.forEach((val) => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'chip' + (selectedArr.indexOf(val) !== -1 ? ' selected' : '');
          chip.textContent = val;
          chip.onclick = () => {
            const idx = selectedArr.indexOf(val);
            if (idx === -1) selectedArr.push(val); else selectedArr.splice(idx, 1);
            renderWeeklyConnectList();
          };
          group.appendChild(chip);
        });
        wrap.appendChild(group);
        return wrap;
      };

      const statusChips = buildChipFilter('Status', 'Status', wcStatusFilter);
      if (statusChips) panel.appendChild(statusChips);
      const requesterChips = buildChipFilter('Requester', 'Requester', wcRequesterFilter);
      if (requesterChips) panel.appendChild(requesterChips);
      const ownerChips = buildChipFilter('Owner', 'Owner', wcOwnerFilter);
      if (ownerChips) panel.appendChild(ownerChips);

      const dateWrap = document.createElement('div');
      dateWrap.className = 'field';
      const dateLabel = document.createElement('label');
      dateLabel.textContent = 'Date range';
      dateWrap.appendChild(dateLabel);
      const dateRow = document.createElement('div');
      dateRow.className = 'wc-date-row';
      const fromInput = document.createElement('input');
      fromInput.type = 'date';
      fromInput.value = wcDateFrom;
      fromInput.onchange = () => { wcDateFrom = fromInput.value; renderWcResults(); };
      const toInput = document.createElement('input');
      toInput.type = 'date';
      toInput.value = wcDateTo;
      toInput.onchange = () => { wcDateTo = toInput.value; renderWcResults(); };
      dateRow.appendChild(fromInput);
      dateRow.appendChild(toInput);
      dateWrap.appendChild(dateRow);
      panel.appendChild(dateWrap);

      els.main.appendChild(panel);
    }

    els.main.appendChild(tileGrid([
      makeTile({ id: 'wc-post-teams', icon: '📨', title: 'Post to Teams…', hint: 'Pick a group and date range, then post the list', onClick: showPostToTeams }),
    ], true));

    const results = document.createElement('div');
    results.id = 'wc-results';
    results.className = 'scroll-list';
    els.main.appendChild(results);
    renderWcResults();
    // The way back is the trail at the top.
  }

  // Manual, on-demand — replaces the old "auto-post whatever fell in a
  // fixed Wednesday-to-Wednesday window" behavior. The real discussion
  // this compiles for doesn't happen on a fixed weekday, so instead of
  // guessing a window, this reuses the report screen's own range picker
  // (rangeSubFieldsHtml/computeRangeFromOptions below) and just asks:
  // which group, which dates.
  function showPostToTeams() {
    setScreen('Post to Teams', tabTrail().concat(currentTicketTab ? [{ label: currentTicketTab, go: () => openTab(currentTicketTab) }] : [], [{ label: 'Tickets', go: () => showWeeklyConnectTickets() }]));
    els.footer.classList.add('hidden');
    els.main.style.minHeight = '';
    const groups = resolveOptions('ConnectGroups', liveOptions);
    els.main.innerHTML = `
      ${groups.length ? `
        <div class="field">
          <label>Group</label>
          <select id="post-teams-group">
            ${groups.map((g) => `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('')}
          </select>
        </div>` : `<p class="login-hint">No Connect Groups configured yet — this will post to the legacy single Teams webhook, if one's set.</p>`}
      <div class="field">
        <label>Range</label>
        <select id="range-type">
          <option value="custom" selected>Custom Range</option>
          <option value="month">Monthly</option>
          <option value="quarter">Quarterly</option>
          <option value="year">Yearly</option>
        </select>
        <!-- No "This Week" here on purpose — that option resolves to a
             backend default (the report's Monday-based week), and
             the whole point of this screen is never guessing a window;
             every post needs an explicit range someone actually picked. -->
      </div>
      <div id="range-fields"></div>
      <div class="login-err" id="post-teams-err"></div>
      <button class="primary" id="post-teams-btn" style="width:100%;">Post to Teams</button>
      <button class="secondary" id="post-teams-back-btn" style="width:100%; margin-top:8px;">Back</button>
    `;

    const rangeFields = document.getElementById('range-fields');
    const rangeType = document.getElementById('range-type');
    const renderSubFields = () => { rangeFields.innerHTML = rangeSubFieldsHtml(rangeType.value); };
    rangeType.onchange = renderSubFields;
    renderSubFields();

    document.getElementById('post-teams-back-btn').onclick = renderWeeklyConnectList;

    document.getElementById('post-teams-btn').onclick = async () => {
      const errEl = document.getElementById('post-teams-err');
      errEl.textContent = '';
      let range;
      try {
        range = computeRangeFromOptions();
        if (!range) throw new Error('Pick a specific date range — "This Week" alone isn\'t enough here.');
      } catch (err) {
        errEl.textContent = err.message;
        return;
      }
      const groupSelect = document.getElementById('post-teams-group');
      const group = groupSelect ? groupSelect.value : '';
      const btn = document.getElementById('post-teams-btn');
      btn.disabled = true;
      btn.textContent = 'Posting…';
      try {
        const result = await window.statusApp.postWeeklyConnectToTeamsNow(group, range, currentTicketTab);
        if (!result || !result.ok) throw new Error((result && result.error) || 'Post failed.');
        showResult({
          success: true,
          title: 'Posted to Teams',
          subtitle: result.message,
          doneLabel: 'Done',
          onDone: showWeeklyConnectTickets,
        });
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Post to Teams';
        errEl.textContent = err.message || String(err);
      }
    };
  }

  function showWeeklyConnectEdit(ticket, fromBoard) {
    const back = fromBoard ? () => showTicketBoard(currentTicketTab) : () => renderWeeklyConnectList();
    setScreen(`Ticket #${ticket['Ticket ID']}`, tabTrail().concat(currentTicketTab ? [{ label: currentTicketTab, go: () => openTab(currentTicketTab) }] : [], fromBoard ? [] : [{ label: 'Tickets', go: () => showWeeklyConnectTickets() }]));
    els.main.style.minHeight = '';
    els.footer.classList.add('hidden');
    // renderMarkdownLite, not escapeHtml — Issue may be a richtext field
    // (see _FieldSchema), so this shows it actually bold/bulleted/linked
    // rather than the raw **/- /[]() syntax. Safe either way: a plain
    // (non-richtext) Issue has none of that syntax to begin with, and
    // renderMarkdownLite escapes real HTML before ever substituting its
    // own tags in.
    els.main.innerHTML = `
      <div class="wc-detail-issue">${renderMarkdownLite(ticket.Issue || '(no description)')}</div>
      <div class="wc-detail-meta">
        ${ticket.Group ? escapeHtml(ticket.Group) + ' · ' : ''}${escapeHtml(ticket.Requester || 'Unknown')} · ${escapeHtml(ticket.Date || '')}${ticket.URL ? ' · <a href="#" id="wc-url-link">Reference link</a>' : ''}
      </div>
    `;
    if (ticket.URL) {
      document.getElementById('wc-url-link').onclick = (e) => {
        e.preventDefault();
        window.statusApp.openExternal(ticket.URL);
      };
    }

    const statusWrap = document.createElement('div');
    statusWrap.className = 'field';
    const statusLabel = document.createElement('label');
    statusLabel.textContent = 'Status';
    const statusSelect = buildFieldInput(currentTicketTab, 'Status', ticket.Status);
    statusWrap.appendChild(statusLabel);
    statusWrap.appendChild(statusSelect);
    els.main.appendChild(statusWrap);

    const commentsWrap = document.createElement('div');
    commentsWrap.className = 'field';
    const commentsLabel = document.createElement('label');
    commentsLabel.textContent = 'Comments';
    // buildFieldInput, not a hand-built textarea — picks up the richtext
    // toolbar+preview automatically if Comments' Type is set to richtext
    // (see _FieldSchema), same as the entry form; falls back to a plain
    // textarea otherwise, exactly like before.
    const commentsInput = buildFieldInput(currentTicketTab, 'Comments', ticket.Comments);
    commentsWrap.appendChild(commentsLabel);
    commentsWrap.appendChild(commentsInput);
    els.main.appendChild(commentsWrap);

    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex; gap:8px; margin-top:6px;';
    const backBtn = document.createElement('button');
    backBtn.type = 'button';
    backBtn.className = 'secondary';
    backBtn.style.flex = '1';
    backBtn.textContent = '← Back';
    backBtn.onclick = back;
    const saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.className = 'primary';
    saveBtn.style.flex = '1';
    saveBtn.textContent = 'Save';
    saveBtn.onclick = async () => {
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      try {
        const result = await window.statusApp.updateWeeklyConnectTicket(
          ticket['Ticket ID'], statusSelect.value, commentsInput.value.trim(), currentTicketTab
        );
        if (!result || result.ok === false) throw new Error((result && result.error) || 'Save failed.');
        showResult({
          success: true,
          title: 'Ticket Updated',
          subtitle: `Ticket #${ticket['Ticket ID']} saved.`,
          doneLabel: 'Done',
          onDone: fromBoard ? back : showWeeklyConnectTickets,
        });
      } catch (err) {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save';
        showError(err.message || String(err), () => showWeeklyConnectEdit(ticket, fromBoard));
      }
    };
    actions.appendChild(backBtn);
    actions.appendChild(saveBtn);
    els.main.appendChild(actions);
  }


  // Version badge + "there's a newer build" nudge — checked once per app
  // launch (not on every popup open, to keep re-opening the form instant).
  // Returns true only if `a` is strictly newer than `b` (semver-ish "x.y.z"
  // compare, not just string inequality — otherwise a stale LatestVersion
  // behind the running app's own version would wrongly show "update available").
  function isNewerVersion(a, b) {
    const pa = String(a).split('.').map((n) => parseInt(n, 10) || 0);
    const pb = String(b).split('.').map((n) => parseInt(n, 10) || 0);
    for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
      const da = pa[i] || 0;
      const db = pb[i] || 0;
      if (da !== db) return da > db;
    }
    return false;
  }

  // On Windows, electron-updater may already have a new version fully
  // downloaded in the background by the time this popup opens (it checks
  // at launch and every few hours, independent of whether the popup is
  // even open) — in that case, skip straight to "Restart to update"
  // instead of the browser-download link, since there's nothing left to
  // download. Mac has no such state (no auto-update there — see the
  // comment in main.js), so isUpdateReadyToInstall() is always false.
  //
  // Kept as a soft, non-blocking header link (not the hard gate below) —
  // this only fires via onUpdateDownloaded, i.e. a download that finished
  // WHILE this popup was already open, possibly mid-form. Interrupting
  // that specific moment was the one thing the original "never force
  // anyone mid-task" design was actually protecting; the hard gate below
  // only ever runs at open time, when there's nothing mid-task to lose.
  // A newer version to download by hand — always on a Mac (it can't
  // install updates by itself without Apple signing), and on Windows when
  // the automatic download failed: the header offers the installer.
  function showManualUpdate(info) {
    if (!info || !info.url || !info.version) return;
    els.updateLink.textContent = `Download v${info.version}`;
    els.updateLink.title = info.mac
      ? 'A newer Daylens for Mac is out — download it and drag it into Applications'
      : 'A newer Daylens is out, but it couldn\'t download by itself — download and run the installer';
    els.updateLink.onclick = () => window.statusApp.openExternal(info.url);
    els.updateLink.classList.add('visible');
  }
  if (window.statusApp.onManualUpdate) {
    window.statusApp.onManualUpdate(showManualUpdate);
    window.statusApp.getManualUpdate().then(showManualUpdate).catch(() => {});
    // Downloaded after all: the window's own "Update ready" takes over.
    if (window.__appMode && window.statusApp.onUpdateReady) window.statusApp.onUpdateReady(() => els.updateLink.classList.remove('visible'));
  }

  function showUpdateReadyToInstall(version) {
    els.updateLink.textContent = 'Restart to update';
    els.updateLink.title = version ? `Update ready — v${version}` : 'Update downloaded — click to restart and install';
    els.updateLink.onclick = () => window.statusApp.quitAndInstall();
    els.updateLink.classList.add('visible');
  }

  // Fires whenever a background download finishes WHILE this popup is
  // open (the Windows-only autoUpdater check on a timer in main.js isn't
  // tied to the popup being open at all) — flips the banner over live,
  // same end state as checkForcedUpdateGate() finding it already downloaded.
  //
  // If the forced gate below is currently showing its "downloading in the
  // background" waiting screen, flip it straight to "Restart to update"
  // right now too — don't make anyone wait out the poll interval below
  // when the real event just told us it's done.
  let forcedGatePollTimer = null;
  if (!window.__appMode) window.statusApp.onUpdateDownloaded(() => {
    showUpdateReadyToInstall();
    if (forcedGatePollTimer) {
      clearInterval(forcedGatePollTimer);
      forcedGatePollTimer = null;
      showForcedUpdateGate({ ready: true });
    }
  });

  // The hard gate: replaces the whole screen with an update prompt and
  // hides Settings, leaving only the update action itself and the
  // Contact Admin footer (footer.js is a sibling of #main, untouched by
  // this) clickable. This is a deliberate reversal of the old "never
  // force anyone mid-task" policy above — that was fine as long as
  // running an old build just meant missing new features, but a build
  // old enough to predate a backend change can sit there submitting into
  // a permanent "Saving..." with no obvious reason why, which is worse
  // than an interruption. Runs ONLY at popup-open time (initial load and
  // every time the window is brought back — see onAppShown), never mid-session, so it never yanks a
  // form out from under someone already using the app; the live
  // in-session case above stays a soft link on purpose. A version check
  // that itself fails (offline, backend hiccup) fails OPEN — never lock
  // someone out over the check failing, only over a genuinely confirmed
  // newer version.
  //
  // A build old enough to predate this gate (and the version-check code
  // itself) can't be reached by any of this — there's no code running on
  // that machine to trigger it. Someone stuck like that needs one manual
  // reinstall of the current installer; after that, this gate (and
  // Windows' silent auto-update) covers them going forward.
  function showForcedUpdateGate({ ready, version, downloadUrl, waiting, min, current }) {
    appGate(true);
    els.footer.classList.add('hidden');
    setScreen('Update required', []);
    els.main.style.minHeight = '';

    // The team's Sheet asked for it (its safety switch).
    const why = min ? `<p class="login-hint" id="too-old-why"><b>Your team's Sheet now needs Daylens ${escapeHtml(min)} or newer</b>${current ? ` — this is v${escapeHtml(current)}` : ''}. Until you update, you can't save anything, so nothing gets saved the old way.</p>` : '';
    let message;
    let buttonLabel = null;
    if (ready) {
      message = 'A newer version has already downloaded in the background — restart to finish updating and continue.';
      buttonLabel = 'Restart to update';
    } else if (waiting) {
      // Windows: electron-updater is already downloading this silently in
      // the background (see the comment in checkForcedUpdateGate below) —
      // there's nothing to click yet. This screen flips itself to "Restart
      // to update" on its own, either via the live onUpdateDownloaded
      // event above or the poll in startForcedGatePolling() below.
      message = `A newer version${version ? ` (v${escapeHtml(version)})` : ''} is downloading in the background. This screen will switch to "Restart to update" automatically as soon as it's ready — no action needed yet.`;
    } else {
      message = `A newer version${version ? ` (v${escapeHtml(version)})` : ''} is available. This build is no longer supported — update to continue.`;
      buttonLabel = 'Download update';
    }

    els.main.innerHTML = `
      <div class="narrow" style="max-width:620px;">
      ${why}
      <p class="login-hint">${message}</p>
      ${buttonLabel
        ? `<button class="primary" id="force-update-btn" style="width:100%;">${buttonLabel}</button>`
        : '<p class="login-hint" style="text-align:center;">⏳ Downloading…</p>'}
      ${waiting && downloadUrl ? '<button type="button" class="secondary" id="force-update-manual" style="width:100%; margin-top:8px;">Taking too long? Download the installer</button>' : ''}
      <p class="login-hint" style="margin-top:10px;">Can't update right now? Ask your team's admin.</p>
      </div>
    `;
    const manualBtn = document.getElementById('force-update-manual');
    if (manualBtn) manualBtn.onclick = () => window.statusApp.openExternal(downloadUrl);
    if (buttonLabel) {
      document.getElementById('force-update-btn').onclick = () => {
        if (ready) window.statusApp.quitAndInstall();
        else if (downloadUrl) window.statusApp.openExternal(downloadUrl);
      };
    }

    if (waiting) startForcedGatePolling();
  }

  // Backs up the live onUpdateDownloaded event above for the case where the
  // download finishes while this popup is closed/hidden (reopening later
  // re-renders via checkForcedUpdateGate anyway, but this also covers the
  // rarer case of the IPC event itself getting missed) — polls the same
  // in-memory flag main.js already exposes rather than re-hitting the
  // backend, so it's cheap enough to run every few seconds for as long as
  // the wait lasts, and it stops itself the moment it finds ready===true.
  function startForcedGatePolling() {
    if (forcedGatePollTimer) return;
    forcedGatePollTimer = setInterval(async () => {
      try {
        if (await window.statusApp.isUpdateReadyToInstall()) {
          clearInterval(forcedGatePollTimer);
          forcedGatePollTimer = null;
          showForcedUpdateGate({ ready: true });
        }
      } catch {
        /* best-effort — next tick tries again */
      }
    }, 3000);
  }

  async function checkForcedUpdateGate() {
    // Desktop app 2.0: updates are never forced on this screen. They
    // download in the background and the main window ASKS before
    // restarting, with what's new (app.html → update prompt). Only the
    // version badge is still set here.
    try {
      const version = await window.statusApp.getAppVersion();
      els.versionBadge.textContent = `v${version}`;
      if (window.__appMode) return false;

      if (await window.statusApp.isUpdateReadyToInstall()) {
        showForcedUpdateGate({ ready: true });
        return true;
      }

      const latest = await window.statusApp.checkLatestVersion();
      if (latest && latest.ok && latest.latest && isNewerVersion(latest.latest, version)) {
        // On Windows, electron-updater is already silently downloading this
        // in the background (autoDownload=true in main.js) — showing a
        // manual "Download update" browser-link screen on top of that is
        // exactly the confusing, redundant screen this was changed to
        // avoid. Show the passive waiting state instead; it flips itself
        // to "Restart to update" once the download actually finishes, no
        // popup close/reopen required. Mac has no autoUpdater (see the
        // comment above autoUpdater.autoDownload in main.js) so it keeps
        // the original manual-download link — nothing is being fetched in
        // the background there to wait on.
        showForcedUpdateGate({
          ready: false,
          version: latest.latest,
          downloadUrl: latest.downloadUrl,
          waiting: !!latest.isWindows,
        });
        return true;
      }
    } catch {
      /* best-effort — never block the app over a version check that itself failed */
    }
    return false;
  }

  // Fire-and-forget, same as getYourName below — main.js already caches
  // this in memory (stale-while-revalidate), so calling it again on every
  // open is cheap and keeps liveOptions from ever going stale for long.
  function refreshLiveOptions() {
    window.statusApp.getOptions({ withDirectory: true }).then((res) => {
      liveOptions = (res && res.options) || {};
    }).catch(() => {
      /* best-effort — resolveOptions() returns [] for anything not loaded yet */
    });
  }

  // Same fire-and-forget, stale-while-revalidate shape as refreshLiveOptions
  // above — main.js already caches this in memory, so this is cheap even
  // when it does hit the network. liveCategories is refreshed separately,
  // inline in showCategoryPicker() (awaited there, not fire-and-forget),
  // since it directly decides which screen renders instead of just filling
  // in a field already on screen.
  function refreshLiveFieldSchema() {
    window.statusApp.getFieldSchema().then((res) => {
      liveFieldSchema = (res && res.fieldSchema) || {};
    }).catch(() => {
      /* best-effort — fieldSpecFor() falls back to a plain text box regardless */
    });
  }

  // Everything the forms need from the team's Sheet. Re-read after
  // signing in (the backend only answers signed-in people).
  function refreshLiveData() {
    refreshLiveOptions();
    refreshLiveFieldSchema();
    refreshLiveDataSourceTypes();
    refreshLiveTabTypes();
  }

  function refreshLiveDataSourceTypes() {
    window.statusApp.getDataSourceTypes().then((res) => {
      liveDataSourceTypes = (res && res.dataSources) || {};
    }).catch(() => {
      /* best-effort — an Excel tab just gets treated as a plain Sheet tab until this loads */
    });
  }

  // Sidebar navigation from the main window's shell (app.html). Ignored
  // while a login/update gate is up — the shell also greys its sidebar
  // out then, this is just the belt to that pair of braces.
  if (window.__appMode) {
    window.addEventListener('message', (e) => {
      const msg = e.data;
      if (!msg || !msg.__statusApp || msg.type !== 'nav' || appGateLocked) return;
      screenSeq++; // whatever was still loading has been left (even for a screen that draws at once)
      switch (msg.screen) {
        case 'home': return showCategoryPicker();
        case 'refresh-data': refreshLiveData(); return showCategoryPicker();
        case 'category': {
          const group = lastCategoryGroups.find((g) => g.name === msg.category);
          return group ? showTabPicker(group) : showCategoryPicker();
        }
        case 'team': return showTeamSetup();
        case 'report': return showReportOptions();
        case 'digest': return showAiDigest();
        case 'logs': return showLogAnalyser();
        case 'settings': return showSettings();
        case 'reminders': return showReminders();
        case 'users': return showUsers();
        case 'about': return showAbout();
        case 'login': return showLoginGate('', true);
        // From the assistant's "→ open" buttons.
        case 'open-tab': return msg.tab ? openTab(msg.tab) : showCategoryPicker();
        case 'new-entry': return msg.tab ? showForm(msg.tab) : showCategoryPicker();
        case 'theme': return showThemes();
        case 'change-password': return showChangePassword(false);
        case 'new-reminder': return showReminderForm();
        case 'features': return showFeatures();
        case 'approvals': return showApprovals();
        case 'monthly-ppt': return showMonthlyPpt();
        case 'open-hit': return openSearchHit(msg.tab, msg.rowIndex, msg.title);
        case 'leave-calendar': return showLeaveCalendar(msg.tab || '');
        case 'directory': return showDirectory();
        case 'documents': return showDocuments();
        case 'ticket-board': return msg.tab ? showTicketBoard(msg.tab) : showCategoryPicker();
        default: return undefined;
      }
    });
    // Window brought back from the tray: refresh the cheap live lists, and
    // re-run the open-time update gate the popup runs on every open — but
    // NOT a reset to Home (unlike the popup), so whatever you were in the
    // middle of is still there. Drafts are saved either way.
    window.statusApp.onAppShown(async () => {
      yourName = await window.statusApp.getYourName();
      refreshLiveData();
      if (appGateLocked) return;
      if (await checkForcedUpdateGate()) return;
      // Signed out meanwhile (logged out, or the account was deactivated
      // and the admin check cleared the session) → back to the login screen.
      await checkLoginGate();
    });
  }

  // Tell the window when the Cancel / Submit bar is showing, so the Ask
  // button can sit above it.
  if (window.__appMode && els.footer) {
    let lastBar = null, lastH = -1;
    const reportBar = () => {
      const v = !els.footer.classList.contains('hidden');
      // how much of the bottom the bar takes (it can wrap to two rows)
      const h = v ? Math.max(0, Math.round(window.innerHeight - els.footer.getBoundingClientRect().top)) : 0;
      if (v !== lastBar || h !== lastH) { lastBar = v; lastH = h; window.__appPost({ type: 'actionbar', visible: v, height: h }); }
    };
    new MutationObserver(reportBar).observe(els.footer, { attributes: true, attributeFilter: ['class'] });
    if (window.ResizeObserver) new ResizeObserver(reportBar).observe(els.footer);
    window.addEventListener('resize', reportBar);
    reportBar();
  }

  // Session ended on the server (account deactivated/deleted) → sign in again.
  window.statusApp.onSessionExpired(() => {
    if (window.__appMode) window.__appPost({ type: 'session-changed' });
    showLoginGate('');
  });
  // Don't wipe the form if they're already on it (typing their new password).
  window.statusApp.onMustChangePassword(() => { if (!document.getElementById('cp-new')) showChangePassword(true); });

  // The team's Sheet needs a newer Daylens (its safety switch — see
  // MIN_APP_VERSION in Code.gs): "Update required" until it's installed.
  // (lastTooOld is declared at the top, next to appGateLocked.)
  function showAppTooOld(info) {
    const was = lastTooOld;
    lastTooOld = info || null;
    if (!info) { if (was) showCategoryPicker(); return; }
    showForcedUpdateGate({ ready: !!info.ready, version: info.latest || '', downloadUrl: info.url || '', waiting: !info.ready && !!info.downloading, min: info.min, current: info.version });
  }
  if (window.statusApp.onAppTooOld) {
    window.statusApp.onAppTooOld(showAppTooOld);
    window.statusApp.getAppTooOld().then((i) => { if (i) showAppTooOld(i); }).catch(() => {});
  }

  window.statusApp.getYourName().then((n) => (yourName = n));
  refreshLiveData();
  checkForcedUpdateGate().then((gated) => {
    if (gated) return;
    checkLoginGate().then((loginGated) => { if (!loginGated) showCategoryPicker(); });
  });

</script>
</body>
</html>
